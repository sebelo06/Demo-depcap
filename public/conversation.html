<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Pro – Conversation</title>
<link rel="stylesheet" href="/nova.css">
<style>
body{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--side);color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;text-decoration:none}.top .logo i{width:18px;height:18px;border-radius:5px;background:#fff;display:inline-block}.top .logo small{font-weight:500;color:var(--sideink)}
.top nav{display:flex;gap:14px;font-size:12.5px}.top nav a{color:var(--sideink)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.hd{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hd h2{font-size:19px;margin:2px 0 4px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--gray);color:#4a4a45}
.chip.w-nous{background:var(--ink);color:#fff}.chip.w-client{background:var(--warnbg);color:var(--warn)}.chip.w-swan{background:#e4ecff;color:#2845b8}.chip.closed{background:var(--okbg);color:var(--ok)}
.gm{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:6px}.gm i{width:8px;height:8px;border-radius:50%;background:var(--warn)}.gm.live i{background:var(--ok)}
/* Trois couloirs : Swan | Nous | Client */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.lh{grid-row:1;position:sticky;top:58px;z-index:2;background:var(--bg);padding:10px 4px 8px;border-bottom:2px solid var(--line);font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.lh small{display:block;text-transform:none;letter-spacing:0;font-weight:400;margin-top:2px}
.lh.swan{border-color:#2845b8}.lh.nous{border-color:var(--ink)}.lh.client{border-color:var(--warn)}
.row{display:contents}
.msg{grid-column:var(--col);grid-row:var(--row);align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 0;position:relative;font-size:13px}
.msg.swan{border-left:3px solid #2845b8}.msg.client{border-left:3px solid var(--warn)}.msg.nous{border-left:3px solid var(--ink)}
.msg.note{background:#fffbe9;border-style:dashed;border-left:3px dashed var(--warn)}
.msg .mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.msg .to{font-size:11.5px;font-weight:700;color:var(--mute)}.msg .to.c{color:var(--warn)}.msg .to.s{color:#2845b8}
.msg .t{font-size:11.5px;color:var(--mute);white-space:nowrap}
.msg .subj{font-size:12px;color:var(--mute);margin-bottom:6px}
.msg pre{white-space:pre-wrap;font:inherit;margin:0;max-height:220px;overflow:hidden;position:relative}
.msg pre.open{max-height:none}
.msg .more{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px}
.msg details{margin-top:8px;font-size:11.5px;color:var(--mute)}.msg details summary{cursor:pointer}
.vis{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:6px;vertical-align:1px}
.vis.client{background:var(--warnbg);color:var(--warn)}.vis.partner{background:#e4ecff;color:#2845b8}.vis.internal{background:var(--gray);color:var(--mute)}
.lane-name{display:none}
.composer{margin-top:22px}.tabs2{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.tabs2 button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.composer textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-height:190px}
.composer .row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:10px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.sim{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:860px){.lanes{grid-template-columns:1fr}.lh{display:none}.msg{grid-column:1!important;grid-row:auto!important}.lane-name{display:inline;font-weight:700;font-size:11px;text-transform:uppercase;color:var(--mute);margin-right:6px}.composer .row2{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><a class="logo" href="/" title="Accueil"><i></i>Nova Pro <small>· Conversation partenaire</small></a>
 <nav><a href="/">Accueil</a><a id="case-link" href="/agent">Dossier</a><a href="/#mailing">Mailing</a><a href="/dashboard">Refus</a></nav></div>
<div class="wrap"><div id="root"><div class="card sub">Chargement…</div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>fetch('/api/'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>r.json());
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
const when=d=>new Date(d).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const id=Number(new URLSearchParams(location.search).get('id'));
let V=null,tab=null,drafts={};
const COL={swan:1,nous:2,client:3},LANE={swan:'Swan',nous:'Nous',client:'Client'};
async function load(){V=await api('threads/'+id);if(V.error){$('#root').innerHTML=`<div class="card">${esc(V.error)}</div>`;return}
 if(!tab)tab=V.thread.waiting_on=='swan'?'note':V.messages.some(m=>m.lane=='client')&&V.thread.waiting_on=='nous'?'partner':'client';draw()}
function dest(m){if(m.kind=='note')return '<span class="to">Note interne</span>';
 if(m.lane=='nous')return m.audience=='client'?`<span class="to c">→ ${esc(m.to_name||m.to_email)}</span>`:'<span class="to s">→ Swan</span>';
 return `<span class="to">${esc(m.from_name||m.from_email)} → nous</span>`}
const VIS={client:'Fil client',partner:'Fil Swan',internal:'Interne'};
function draw(){const t=V.thread,c=V.case,M=V.messages,sh=V.shareholders;
 $('#case-link').href='/agent?id='+c.id;
 const lastClientOut=[...M].reverse().find(m=>m.audience=='client'&&m.kind=='out'),lastClientIn=[...M].reverse().find(m=>m.lane=='client');
 const ago=t.waiting_since?Math.max(0,Math.round((Date.now()-new Date(t.waiting_since))/36e5)):null;
 $('#root').innerHTML=`<div class="card"><div class="hd"><div><div class="sub mono">${esc(c.ref)}${t.ticket?' · ticket Zendesk #'+esc(t.ticket):''} · dépôt ${esc(c.swan_id.slice(0,8))}…</div>
   <h2>${esc(t.subject||'Demande du partenaire')}</h2><a href="/agent?id=${c.id}"><b>${esc(c.company_name)}</b></a>
   <div class="chips"><span class="chip ${t.status=='closed'?'closed':'w-'+t.waiting_on}">${esc(t.waiting_label)}${t.status!='closed'&&ago!=null?` · depuis ${ago<1?'moins d’une heure':ago<24?ago+' h':Math.round(ago/24)+' j'}`:''}</span><span class="chip">${M.length} message${M.length>1?'s':''}</span></div></div>
   <div style="text-align:right;margin-left:auto"><div class="gm ${V.gmail.mode=='live'?'live':''}"><i></i>Gmail ${V.gmail.mode=='live'?'connecté':'simulé'} · ${esc(V.gmail.address)}</div>
    <div class="sub" style="margin-top:4px">Adresse du dossier : <span class="mono">${esc(V.caseAddress)}</span></div>
    <button class="btn ghost sm" id="close" style="margin-top:8px">${t.status=='closed'?'Rouvrir la conversation':'Clôturer la conversation'}</button></div></div>
  ${V.pendingDraft?`<div class="warn" style="margin-top:12px"><b>Brouillon client à valider</b> : la demande de Swan a été reformulée, elle attend votre validation. <a href="/#mailing">Ouvrir Mailing › Emails partenaire</a></div>`:''}</div>
 <div class="lanes"><div class="lh swan">Swan · partenaire<small>Fil du ticket, jamais visible du client</small></div><div class="lh nous">Nous · opérations<small>Reformulation, transmission, notes</small></div><div class="lh client">Client<small>${esc(sh.map(s=>s.name).join(', '))}</small></div>
  ${M.map((m,i)=>{const long=(m.body||'').split('\n').length>11||(m.body||'').length>700;
   return `<div class="msg ${m.lane} ${m.kind=='note'?'note':''}" style="--col:${COL[m.lane]};--row:${i+2}"><div class="mh"><span><span class="lane-name">${LANE[m.lane]}</span>${dest(m)}<span class="vis ${m.audience}">${VIS[m.audience]}</span></span><span class="t">${when(m.created_at)}</span></div>
    ${m.subject&&m.kind!='note'?`<div class="subj">${esc(m.subject)}</div>`:''}<pre>${esc(m.body)}</pre>${long?'<button class="more">Afficher tout</button>':''}
    ${m.gmail_id?`<details><summary>En-têtes Gmail</summary><div class="mono">De : ${esc(m.from_email||'')}<br>À : ${esc(m.to_email||'')}<br>Fil : ${esc(m.gmail_thread||'')}<br>Message-ID : ${esc(m.message_id||'')}${m.in_reply_to?`<br>En réponse à : ${esc(m.in_reply_to)}`:''}</div></details>`:''}</div>`}).join('')}</div>
 ${t.status=='closed'?'':composer(t,c,sh,lastClientOut,lastClientIn)}
 ${V.gmail.mode!='live'&&t.status!='closed'?`<div class="card" style="margin-top:16px"><h3>Simulation <span class="sub" style="font-weight:400">· Gmail simulé</span></h3><div class="sim">
  <button class="btn ghost sm" id="sim-client" ${lastClientOut?'':'disabled title="Envoyez d’abord un message au client"'}>Le client répond</button><button class="btn ghost sm" id="sim-swan">Swan répond</button>
  <span class="sub">En réel, ces messages arrivent dans la boîte Gmail et sont rattachés automatiquement (adresse du dossier, fil du ticket).</span></div></div>`:''}`;
 bindComposer()}
function composer(t,c,sh,lastOut,lastIn){
 const to=sh.find(s=>s.email==lastOut?.to_email)||sh.find(s=>s.is_admin)||sh[0];
 drafts.client??=`Bonjour ${to.name.split(' ')[0]},\n\n\n\nMerci,\nL’équipe Nova Pro`;
 drafts.partner??=lastIn?`Bonjour,\n\nSuite à votre demande${t.ticket?` (ticket #${t.ticket})`:''} concernant le dossier de dépôt de capital ${c.swan_id} (${c.company_name}), voici la réponse de ${lastIn.from_name} :\n\n« ${lastIn.body.replace(/\n{2,}/g,'\n').trim()} »\n\nLes documents éventuels ont été déposés dans le dossier.\n\nBien cordialement,\nL’équipe opérations Nova Pro`
  :`Bonjour,\n\nConcernant le dossier de dépôt de capital ${c.swan_id} (${c.company_name}) :\n\n\n\nBien cordialement,\nL’équipe opérations Nova Pro`;
 drafts.note??='';
 const resume=c.status=='WaitingForAdditionalInformation'&&c.info_source=='email'&&c.info_relayed;
 return `<div class="card composer"><div class="tabs2" role="tablist">${[['client','Écrire au client'],['partner','Répondre à Swan'],['note','Note interne']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab==k}" class="${tab==k?'on':''}">${l}</button>`).join('')}</div>
  ${tab=='client'?`<div class="row2"><div><label for="c-to">Destinataire</label><select id="c-to">${sh.map(s=>`<option value="${esc(s.email)}" ${s.email==to.email?'selected':''}>${esc(s.name)} (${s.is_admin?'fondateur':'associé'})</option>`).join('')}</select></div>
   <div><label for="c-subj">Objet</label><input id="c-subj" value="${esc(lastOut?'Re: '+lastOut.subject.replace(/^(Re:\s*)+/i,''):c.company_name+' : votre dépôt de capital')}"></div></div>
   <textarea id="c-body" aria-label="Message au client">${esc(drafts.client)}</textarea>
   <div class="hint">Envoyé depuis <span class="mono">${esc(V.caseAddress)}</span> : la réponse du client revient dans cette conversation. Le partenaire n’est jamais mentionné.</div><div id="c-warn"></div>
   <div class="acts"><button class="btn" id="send-client">Envoyer au client</button></div>`
  :tab=='partner'?`<textarea id="p-body" aria-label="Réponse à Swan">${esc(drafts.partner)}</textarea>
   <div class="hint">Répond dans le fil du ticket Zendesk (même fil Gmail, en-tête In-Reply-To) : Swan le rattache au ticket.</div>
   ${resume?`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:10px"><input type="checkbox" id="p-resume" checked style="width:auto">Le dossier attendait ce complément : relancer la revue du partenaire</label>`:''}
   <div class="acts"><button class="btn" id="send-partner">Envoyer à Swan</button></div>`
  :`<textarea id="n-body" style="min-height:110px" placeholder="Visible uniquement par l’équipe" aria-label="Note interne">${esc(drafts.note)}</textarea><div class="acts"><button class="btn" id="send-note">Ajouter la note</button></div>`}</div>`}
function bindComposer(){
 const cb=$('#c-body');if(cb)cb.oninput=()=>{drafts.client=cb.value;$('#c-warn').innerHTML=/swan|zendesk|ticket/i.test(cb.value+$('#c-subj').value)?'<div class="warn bad" style="margin-top:8px">Le message mentionne le partenaire ou un ticket : à reformuler (marque blanche).</div>':''};
 const pb=$('#p-body');if(pb)pb.oninput=()=>drafts.partner=pb.value;const nb=$('#n-body');if(nb)nb.oninput=()=>drafts.note=nb.value}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Réduire':'Afficher tout';return}
 if(b.dataset.tab){tab=b.dataset.tab;draw();return}
 const run=async(path,body,msg,reset)=>{b.disabled=true;const r=await api(path,body);if(r.error){toast(r.error);b.disabled=false;return}V=r;if(reset)drafts[reset]=undefined;draw();toast(msg);scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
 if(b.id=='send-client')return run(`threads/${id}/client`,{to_email:$('#c-to').value,subject:$('#c-subj').value,body:$('#c-body').value},'Message envoyé au client','client');
 if(b.id=='send-partner')return run(`threads/${id}/partner`,{body:$('#p-body').value,resume:$('#p-resume')?$('#p-resume').checked:false},'Réponse envoyée à Swan','partner');
 if(b.id=='send-note')return run(`threads/${id}/note`,{body:$('#n-body').value},'Note ajoutée','note');
 if(b.id=='sim-client'){drafts.partner=undefined;tab='partner';return run(`threads/${id}/simulate-client`,{},'Réponse du client reçue')}
 if(b.id=='sim-swan')return run(`threads/${id}/simulate-partner`,{},'Réponse de Swan reçue');
 if(b.id=='close')return run(`threads/${id}/close`,{closed:V.thread.status!='closed'},V.thread.status=='closed'?'Conversation rouverte':'Conversation clôturée')});
load();
</script></body></html>
