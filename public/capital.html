 <a href="/" style="color:var(--sideink)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Accueil de la démo</a>
 <a data-t="capital"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V10l7-5 7 5v10M9 20v-6h6v6"/></svg>Dépôt de capital</a>
 <a data-t="mailing"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Mailing<span class="nb" id="nb-ml" style="display:none"></span></a>
 <div class="sep"></div>
 <a href="/client" target="_blank" style="color:var(--sideink)"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Vue client ↗</a>

 <div class="badge" id="mode"></div>
</aside>
<main>
 <section class="sec on" id="capital"><header class="top"><h2>Atelier technique</h2><span class="pill">Vues client et interne, journal API · données fictives</span></header><div id="cap-root"></div></section>
 <section class="sec" id="mailing"><header class="top"><h2>Mailing</h2><span class="pill">À construire ensemble</span></header><div id="ml-root"></div></section>
</main>
<dialog id="cap-doc-dlg"><div style="padding:28px"><div id="cd-head"></div><div id="cd-checks" style="margin:12px 0"></div><div id="cd-seen" class="stacked" style="display:grid;gap:10px"></div>
 <div style="margin:12px 0"><label>Fichier (pdf, png ou jpg, 5 Mo max)</label><input type="file" id="cd-file" accept=".pdf,.png,.jpg,.jpeg"></div><div id="cd-warn"></div>
 <div class="acts"><button class="btn ghost" onclick="this.closest('dialog').close()">Annuler</button> <button class="btn" id="cd-send" disabled>Envoyer</button></div></div></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const eur=v=>Number(v).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const fr=d=>new Date(d).toLocaleDateString('fr-FR');
const lab={Draft:'Brouillon',Sent:'Envoyée',Late:'En retard',Paid:'Payée',Booked:'Validée',Upcoming:'À venir',Rejected:'Rejetée',Canceled:'Annulée',Pending:'En cours',ConsentPending:'À valider',Enabled:'Active',Opened:'Ouvert'};
const api=(p,o)=>fetch('/api/'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>r.json());
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
const go=t=>{$('main').classList.remove('wide');$$('aside a,.sec').forEach(x=>x.classList.remove('on'));$(`aside a[data-t=${t}]`).classList.add('on');$('#'+t).classList.add('on')};
$$('aside a[data-t]').forEach(a=>a.onclick=()=>go(a.dataset.t));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
const pill=s=>`<span class="pill ${s}">${lab[s]||s}</span>`;
const ini=s=>s.split(/[\s→]+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const money=a=>Number(a.value).toLocaleString('fr-FR',{style:'currency',currency:a.currency});
const PROD={SEPACreditTransfer:'Virement SEPA',SEPADirectDebit:'Prélèvement SEPA',InternationalCreditTransfer:'Virement international',Card:'Carte',Fees:'Frais',InternalCreditTransfer:'Virement interne'};
const M=c=>eur(c/100);
const err=e=>toast(e.error||'Erreur');
const call=async(p,o)=>{const r=await api(p,o||{});if(r.error){err(r);throw r}return r};
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ----- dépôt de capital : marque blanche (le client ne voit que Nova Pro) + vue interne ----- */
const capE=x=>(x/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const capEl=$('#cap-root');
let capV=null,capInternal=true,capSel=null,capList=[];
try{capInternal=localStorage.getItem('capInternal')!=='0'}catch{}
const T_CASE={Completed:'t-ok',WaitingForRegisterExtract:'t-ok',Canceled:'t-ko',WaitingForAdditionalInformation:'t-ko'};
const T_SH={CapitalTransferred:'t-ok',CapitalFundsWiredToNotary:'t-ok',WaitingForTransfer:'t-info',CapitalDepositCanceled:'t-mute'};
const T_DOC={Validated:'t-ok',Uploaded:'t-info',Pending:'t-mute',Refused:'t-ko'};
const tp=(cls,txt)=>`<span class="pill ${cls||'t-warn'}">${esc(txt)}</span>`;
const capRow=(n='',e='',a='',ad='')=>`<div class="cap-sh"><input placeholder="Nom de l'associé" value="${esc(n)}" data-f="name"><input placeholder="Email" value="${esc(e)}" data-f="email"><input type="number" min="1" step="1" placeholder="Apport (€)" value="${a}" data-f="amount"><input placeholder="Adresse (comme sur le justificatif)" value="${esc(ad)}" data-f="address"><button type="button" class="btn ghost sm" data-rm aria-label="Retirer">×</button></div>`;
function capForm(){return `
 <div class="card"><h3>Déposer le capital de votre société</h3>
  <div class="sub" style="margin-bottom:14px">Chaque associé vérifie son identité et vire son apport sur un compte de dépôt à son nom. Le notaire délivre l’attestation de dépôt des fonds, puis libère le capital sur votre compte pro dès l’immatriculation.</div>
  <form id="f-cap" style="display:block"><div style="display:grid;gap:12px;grid-template-columns:2fr 1fr 2fr"><div><label for="cap-co">Nom de la société</label><input id="cap-co" name="companyName" value="Studio Nova SAS" required></div>
  <div><label for="cap-lf">Forme juridique</label><select id="cap-lf" name="legalForm"><option>SAS</option><option>SASU</option><option>SARL</option><option>EURL</option></select></div>
  <div><label for="cap-ad">Adresse du siège</label><input id="cap-ad" name="address" value="12 rue de la Paix, 75002 Paris"></div></div>
  <div style="margin-top:12px;max-width:360px"><label for="cap-src">Statuts</label><select id="cap-src" name="articlesSource"><option value="generated">Générés par Nova Pro (à signer)</option><option value="client">Fournis par le client (contrôle formaliste)</option></select></div>
  <h3 style="margin:18px 0 8px">Associés et apports</h3><div class="sub" style="margin-bottom:8px">Le premier associé est le fondateur : il pilote le dossier.</div>
  <div id="cap-shs">${capRow('Camille Durand','camille@studio-durand.fr',3000,'8 rue des Lilas, 69003 Lyon')}${capRow('Léo Martin','leo@example.fr',2000,'4 avenue Foch, 75116 Paris')}</div>
  <button type="button" class="btn ghost sm" id="cap-add">+ Ajouter un associé</button> <span class="sub" id="cap-total" style="margin-left:10px"></span>
  <div style="margin-top:16px"><button class="btn">Créer le dossier</button></div></form></div>`}
// Libellé client : une demande libre du partenaire pas encore relayée reste invisible pour le client
const capLabel=c=>c.status=='WaitingForAdditionalInformation'&&c.info_source=='email'&&!c.info_relayed?'Dossier en vérification':c.label;
function capClient(v){const c=v.case,pct=c.total_cents?Math.round(v.funded/c.total_cents*100):0,has=id=>v.actions.some(a=>a.id==id);
 let banner='';
 if(c.status=='WaitingForAdditionalInformation'&&c.info_source=='email'&&c.info_relayed)banner=`<div class="warn bad"><b>Un complément est nécessaire</b><br>${esc(c.info_request)}${has('answer')?'<div style="margin-top:8px"><button class="btn sm" data-act="answer">J’ai envoyé le complément</button></div>':''}</div>`;
 else if(c.status=='WaitingForAdditionalInformation')banner=`<div class="warn bad"><b>Un document est à remplacer</b><br>${esc(c.info_request)}. Voir la rubrique Documents.</div>`;
 if(c.certificate_at&&c.status!='Canceled')banner+=`<div class="warn good"><b>Votre attestation de dépôt des fonds est disponible.</b> ${c.status=='WaitingForRegisterExtract'?'Joignez-la à votre demande d’immatriculation, puis déposez l’extrait Kbis ci-dessous.':''}<div style="margin-top:8px"><a class="btn sm" target="_blank" href="/api/capital/${c.id}/certificate.pdf">Télécharger l’attestation</a></div></div>`;
 if(c.status=='Completed')banner+=`<div class="warn good">Le capital de ${capE(c.total_cents)} est arrivé sur votre compte pro (voir Transactions).</div>`;
 if(c.status=='Canceled')banner=`<div class="warn bad">${c.cancel_sensitive?'Ce dossier ne peut pas aboutir. Un conseiller va vous contacter.':`Dossier annulé : ${esc(c.cancel_label||c.cancel_note||'')}.`}</div>`;
 const steps=`<div class="cap-steps">${v.steps.map((s,i)=>`<div class="cs ${s.state}${s.goal?' goal':''}"><span class="cs-dot">${s.state=='done'?'✓':i+1}</span><b>${esc(s.title)}</b><span class="sub">${esc(s.desc)}</span></div>`).join('')}</div>`;
 const sh=v.shareholders.map(s=>`<tr><td><span class="av">${ini(s.name)}</span><b>${esc(s.name)}</b>${s.is_admin?'<span class="tag">Fondateur</span>':''}<div class="sub" style="margin-left:40px">${esc(s.email)}</div></td>
  <td class="r"><b>${capE(s.amount_cents)}</b></td><td>${tp(T_SH[s.status],s.label)}</td>
  <td>${s.iban?`<span class="mono">${esc(s.iban)}</span> <button class="lnk" data-copy="${esc(s.iban)}">Copier</button>`:'<span class="sub">Disponible après la vérification d’identité</span>'}${s.attempts&&s.status=='WaitingForTransfer'?`<div class="sub" style="color:var(--ko)">${s.attempts} virement${s.attempts>1?'s':''} refusé${s.attempts>1?'s':''} · nouveau virement attendu</div>`:''}</td></tr>`).join('');
 const groups=[[c.company_name,v.documents.filter(d=>!d.shareholder_id&&!d.notary)],...v.shareholders.map(s=>[s.name,v.documents.filter(d=>d.shareholder_id==s.id)])];
 const docs=groups.map(([g,ds])=>`<tr class="grp"><td colspan="2">${esc(g)}</td></tr>`+ds.map(d=>`<tr><td>${esc(d.label)}${d.kyc?'<div class="sub">Recueillie lors de la vérification d’identité</div>':''}${d.explanation?`<div class="warn bad" style="margin:6px 0 0"><b>Refusé : ${esc(d.explanation.title)}</b><br>${esc(d.explanation.fix)}</div>`:''}</td>
  <td class="r">${tp(T_DOC[d.status],d.status_label)}${d.uploadable?` <button class="btn sm" data-doc="${d.id}">${d.status=='Refused'?'Remplacer':'Déposer'}</button>`:''}</td></tr>`).join('')).join('');
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><div class="sub">Dossier ${esc(c.ref)}</div><h3 style="margin:2px 0 0;font-size:18px">${esc(c.company_name)} <span class="sub" style="font-size:13px">${esc(c.legal_form||'')}</span></h3><div class="sub">${esc(c.address||'')}</div></div>${tp(T_CASE[c.status],capLabel(c))}</div>
  <div class="grid" style="margin:14px 0 0"><div><div class="lbl">Capital</div><div class="big" style="font-size:24px">${capE(c.total_cents)}</div></div><div><div class="lbl">Apports reçus</div><div class="big" style="font-size:24px">${capE(v.funded)}</div><div class="prog"><i style="width:${pct}%"></i></div></div></div>
  ${banner}${steps}
  ${has('cancel')?'<div style="margin-top:12px"><button class="btn ghost sm" data-act="cancel">Annuler le dossier</button> <span class="sub">Possible tant qu’aucun apport n’est versé.</span></div>':''}</div>
 <div class="card"><h3>Associés</h3><div style="overflow:auto"><table><thead><tr><th>Associé</th><th class="r">Apport</th><th>Statut</th><th>Compte de dépôt</th></tr></thead><tbody>${sh}</tbody></table></div></div>
 <div class="card"><h3>Documents</h3><table><tbody>${docs}</tbody></table></div>
 <div class="card"><h3>Historique</h3><ul class="lg">${v.timeline.map(e=>`<li><span class="sub">${new Date(e.created_at+'Z').toLocaleString('fr-FR')}</span><br>${esc(e.text)}</li>`).join('')}</ul></div>
 `}
const KIND={api:'API',webhook:'Webhook',rule:'Règle',skip:'Ignoré',zendesk:'Zendesk'};
function capInt(v){const c=v.case,next=v.actions.find(a=>a.happy),byActor={};
 v.actions.forEach(a=>(byActor[a.actorLabel]=byActor[a.actorLabel]||[]).push(a));
 const reasonSel=a=>a.needsReason?`<select class="rs" data-reason-for="${a.id}" aria-label="Motif">${Object.entries(a.needsReason=='cancel'?v.cancelReasons:v.reasons).map(([k,t])=>`<option value="${k}">${esc(t)}</option>`).join('')}</select>`:'';
 const commentIn=a=>a.needsReason=='doc'?`<input class="rc" data-comment-for="${a.id}" aria-label="Commentaire de l’analyste" placeholder="Commentaire de l’analyste (vide = type, « - » = aucun)">`:'';
 const acts=Object.entries(byActor).map(([actor,l])=>`<div class="actor">${esc(actor)}</div>`+l.map(a=>`<div class="a${a.needsReason=='doc'?' wide':''}"><span>${esc(a.label)}</span><span class="a-r">${commentIn(a)}${reasonSel(a)}<button class="btn ghost sm" data-act="${a.id}">Passer</button></span></div>`).join('')).join('');
 const ids=[['Dossier','capitalDepositCase',c.status,c.swan_id],...v.shareholders.flatMap(s=>[[s.name,'shareholder',s.status,s.swan_id],...(s.account_id?[[s.name,'account (dépôt)','',s.account_id]]:[])]),
  ...v.documents.map(d=>[`${d.label}${d.shareholder_id?' · '+d.owner:''}`,d.kyc?'supportingDocument':'capitalDepositDocument',d.status,d.swan_id])];
 return `<div class="card int"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h3 style="margin:0">Vue interne</h3><span class="sub">Non visible du client</span></div>
  <div class="kv" style="grid-template-columns:130px 1fr"><span>Réf. client</span><span><b>${esc(c.ref)}</b></span><span>ID dépôt Swan</span><span><span class="mono">${esc(c.swan_id)}</span> <button class="lnk" data-copy="${esc(c.swan_id)}">Copier</button></span><span>Statut Swan</span><span><span class="mono">${esc(c.status)}</span>${c.cancel_reason?` · <span class="mono">${esc(c.cancel_reason)}</span>`:''}</span></div>
  ${next?`<button class="btn" data-act="next" style="width:100%">Passer l’étape suivante</button><div class="sub" style="margin-top:6px">${esc(next.actorLabel)} : ${esc(next.label)}</div>`:'<div class="sub">Dossier terminé : plus aucune action.</div>'}
  ${v.partnerEmails?`<div class="warn" style="margin-top:12px"><b>${v.partnerEmails} email${v.partnerEmails>1?'s':''} du partenaire à valider</b> pour ce dossier. <button class="lnk" data-go-mailing>Ouvrir Mailing › Emails partenaire</button></div>`:''}
  ${v.docRefusals.length?`<div class="actor">Refus de documents · commentaires (${v.docRefusals.length})</div><ul class="lg rf">${v.docRefusals.map(r=>`<li class="${r.current?'cur':''}"><div><b>${esc(r.label)}</b> · ${esc(r.owner||'')} <span class="sub">${esc(r.refused_by||'')} · ${new Date(r.created_at+'Z').toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</span>${r.current?' <span class="pill t-ko">en cours</span>':''}</div>
   <div class="sub"><span class="mono">${esc(r.reason_code||'')}</span> → consigne client : ${esc(r.code_title)}</div>
   ${r.reason?`<blockquote>${esc(r.reason)}</blockquote>${r.partner_mentioned?'<div class="sub" style="color:var(--ko)">Mentionne le partenaire : ne pas transmettre tel quel au client.</div>':''}`:'<div class="sub"><i>Aucun commentaire de l’analyste (champ reason vide).</i></div>'}</li>`).join('')}</ul>`:''}
  <div class="acts-list">${acts}</div></div>
 <div class="card"><h3>Journal API et webhooks</h3><ul class="lg">${v.log.map(l=>`<li>${l.detail?`<details><summary><span class="k ${l.kind}">${KIND[l.kind]||l.kind}</span>${esc(l.title)}</summary><pre>${esc(l.detail)}</pre></details>`:`<span class="k ${l.kind}">${KIND[l.kind]||l.kind}</span>${esc(l.title)}`}</li>`).join('')}</ul></div>
 <div class="card"><h3>Messages envoyés (${v.messages.length})</h3><ul class="lg">${v.messages.map(m=>`<li><details><summary><span class="k rule">${esc(m.rule)}</span>${esc(m.to_name)} · ${esc(m.subject)}</summary><pre>${esc(m.body)}</pre></details></li>`).join('')||'<li class="sub">Aucun message.</li>'}</ul><button class="lnk" data-go-mailing>Ouvrir le menu Mailing</button></div>
 <div class="card"><h3>Identifiants Swan (fictifs)</h3><div style="overflow:auto"><table class="ids"><tbody>${ids.map(([n,t,s,id])=>`<tr><td>${esc(n)}<div class="sub mono">${t}</div></td><td><span class="mono">${esc(s)}</span></td><td><span class="mono" title="${esc(id)}">${esc(id.slice(0,8))}…</span></td></tr>`).join('')}</tbody></table></div></div>`}
// Tous les dossiers : ouvrir, annuler, supprimer (mode test)
function capCases(){const open=capList.filter(x=>!['Completed','Canceled'].includes(x.status)).length;
 return `<div class="card" style="padding:16px 18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:${capList.length?10:0}px"><h3 style="margin:0">Dossiers (${capList.length}) <span class="sub" style="font-weight:400">· ${open} en cours</span></h3><button class="btn sm" id="cap-new">+ Nouveau dossier</button></div>
  ${capList.length?`<div style="overflow:auto;max-height:260px"><table><tbody>${capList.map(x=>{const cur=x.id==capV?.case?.id,closed=['Completed','Canceled'].includes(x.status);
   return `<tr style="${cur?'background:#f4f1ff':''}"><td><b>${esc(x.company_name)}</b><div class="sub mono">${esc(x.ref)}</div></td><td><span class="pill ${x.status=='Completed'?'t-ok':x.status=='Canceled'?'t-mute':'t-info'}">${esc(x.label)}</span></td>
   <td class="r">${cur?'<span class="sub">Affiché</span>':`<button class="btn ghost sm" data-open="${x.id}">Ouvrir</button>`}${closed?'':` <button class="btn ghost sm" data-withdraw="${x.id}">Annuler</button>`} <button class="btn ghost sm" data-del="${x.id}" aria-label="Supprimer ${esc(x.ref)}" style="color:var(--ko)">Supprimer</button></td></tr>`}).join('')}</tbody></table></div>`:''}</div>`}
function capRender(v){capV=v;capSel=v.case?.id;const wide=capInternal;$('main').classList.toggle('wide',wide);
 capEl.innerHTML=capCases()+`<div class="cap-bar"><span class="sub">${capInternal?'Vue client à gauche, vue interne à droite.':'Vue client (ce que voit le fondateur).'}</span><button class="btn ghost sm" id="cap-int">${capInternal?'Masquer la vue interne':'Afficher la vue interne'}</button></div>
  <div class="cap-grid ${capInternal?'':'solo'}"><div>${capClient(v)}</div>${capInternal?`<div>${capInt(v)}</div>`:''}</div>`}
async function loadCapital(forceForm){capList=await api('capital/queue');if(capSel&&!capList.some(x=>x.id==capSel))capSel=null;
 const v=await api('capital'+(capSel?'?id='+capSel:''));
 if(!v.case||forceForm===true){capV=forceForm===true?null:v;$('main').classList.remove('wide');capEl.innerHTML=capCases()+capForm(null);capTotal();return}
 capRender(v)}
function capTotal(){const t=[...capEl.querySelectorAll('[data-f=amount]')].reduce((a,i)=>a+(Number(i.value)||0),0);const el=$('#cap-total');if(el)el.textContent='Capital total : '+t.toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
capEl.addEventListener('input',capTotal);
capEl.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='cap-add'){$('#cap-shs').insertAdjacentHTML('beforeend',capRow());return}
 if(b.dataset.rm!==undefined){b.closest('.cap-sh').remove();capTotal();return}
 if(b.id=='cap-new'){loadCapital(true);return}
 if(b.dataset.open){capSel=+b.dataset.open;loadCapital();return}
 if(b.dataset.withdraw){const x=capList.find(y=>y.id==b.dataset.withdraw);if(!confirm(`Annuler le dossier ${x.ref} (${x.company_name}) ?\nLes associés sont prévenus par email ; les apports déjà versés sont restitués.`))return;
  b.disabled=true;try{await call(`capital/${x.id}/withdraw`);capSel=x.id;toast('Dossier annulé');loadCapital()}catch{b.disabled=false}return}
 if(b.dataset.del){const x=capList.find(y=>y.id==b.dataset.del);if(!confirm(`Supprimer définitivement le dossier ${x.ref} (${x.company_name}) ?\nToutes ses données de test seront effacées. Cette action est irréversible.`))return;
  try{await call(`capital/${x.id}/delete`);if(capSel==x.id)capSel=null;toast(`Dossier ${x.ref} supprimé`);loadCapital()}catch{}return}
 if(b.id=='cap-int'){capInternal=!capInternal;try{localStorage.setItem('capInternal',capInternal?'1':'0')}catch{}capRender(capV);return}
 if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('Copié')}catch{toast(b.dataset.copy)}return}
 if(b.dataset.goMailing!==undefined){go('mailing');loadMailing();return}
 if(b.dataset.doc){openCapDoc(b.dataset.doc);return}
 if(b.dataset.act){const action=b.dataset.act,rs=capEl.querySelector(`[data-reason-for="${CSS.escape(action)}"]`),cm=capEl.querySelector(`[data-comment-for="${CSS.escape(action)}"]`);b.disabled=true;
  try{const r=await call(`capital/${capV.case.id}/act`,{action,reasonCode:rs?.value,message:cm?.value||undefined});const n=r.messages.length-capV.messages.length;capList=await api('capital/queue');capRender(r);
   toast(n>0?`${n} message${n>1?'s':''} envoyé${n>1?'s':''} (voir Mailing)`:'Action passée');}catch{b.disabled=false}}});
let capDoc=null,capForce=false;
function openCapDoc(id){const d=capV.documents.find(x=>x.id==id);capDoc=d;const r=d.rule||{title:d.label,checks:[]};
 $('#cd-head').innerHTML=`<h3 style="margin:0">${esc(d.label)}</h3><div class="sub">${esc(d.owner)}</div>${d.explanation?`<div class="warn bad" style="margin:10px 0 0"><b>Refus précédent : ${esc(d.explanation.title)}</b><br>${esc(d.explanation.fix)}</div>`:''}`;
 $('#cd-checks').innerHTML='<b>Avant d’envoyer, vérifiez :</b>'+r.checks.map(c=>`<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:8px 0 0"><input type="checkbox" class="cd-ck" style="width:auto;margin-top:3px"><span>${esc(c)}</span></label>`).join('');
 const need=r.declared;$('#cd-seen').innerHTML=need=='address'||need=='companyAddress'?`<div><label for="cd-address">Adresse figurant sur le document</label><input id="cd-address" placeholder="Recopiez l’adresse telle qu’elle apparaît"></div>`:need=='company'?`<div><label for="cd-name">Raison sociale figurant sur le document</label><input id="cd-name" placeholder="Recopiez-la telle qu’elle apparaît"></div>`:'';
 $('#cd-file').value='';$('#cd-warn').innerHTML='';capForce=false;$('#cd-send').textContent='Envoyer';capCk();$('#cap-doc-dlg').showModal()}
const capCk=()=>{$('#cd-send').disabled=![...document.querySelectorAll('.cd-ck')].every(x=>x.checked)||!$('#cd-file').files[0]};
$('#cd-checks').addEventListener('change',capCk);$('#cd-file').addEventListener('change',capCk);
$('#cd-send').onclick=async()=>{const f=$('#cd-file').files[0];
 const o=await api(`capital/${capV.case.id}/docs/${capDoc.id}`,{filename:f.name,size:f.size,confirmed:true,force:capForce,seen:{address:$('#cd-address')?.value,name:$('#cd-name')?.value}});
 if(o.warnings?.length){$('#cd-warn').innerHTML=`<div class="warn bad"><b>Écart détecté avec le dossier</b><br>• ${o.warnings.map(esc).join('<br>• ')}<br><span class="sub">Corrigez le document ou la saisie, ou envoyez quand même (risque de refus).</span></div>`;capForce=true;$('#cd-send').textContent='Envoyer quand même';return}
 if(o.error){$('#cd-warn').innerHTML=`<div class="warn bad">${esc(o.error)}</div>`;return}
 $('#cap-doc-dlg').close();capList=await api('capital/queue');capRender(o);toast('Document envoyé (maquette : le fichier n’est pas conservé)')};
capEl.addEventListener('submit',async e=>{if(e.target.id!='f-cap')return;e.preventDefault();
 const shareholders=[...capEl.querySelectorAll('.cap-sh')].map(r=>Object.fromEntries([...r.querySelectorAll('[data-f]')].map(i=>[i.dataset.f,i.value])));
 try{const r=await call('capital',{companyName:e.target.companyName.value,legalForm:e.target.legalForm.value,address:e.target.address.value,articlesSource:e.target.articlesSource.value,shareholders});capSel=r.case.id;capList=await api('capital/queue');capRender(r);toast('Dossier créé : invitations envoyées (voir Mailing)');}catch{}});
$('aside a[data-t=capital]').addEventListener('click',()=>loadCapital());
/* ----- mailing : emails partenaire à valider, modèles, envois ----- */
let mlSent=[],mlTab='partner',mlItems=[],mlSel=null;
const SM_ST={to_validate:['À valider','t-warn'],unmatched:['Non rattaché','t-ko'],sent:['Envoyé','t-ok'],ignored:['Ignoré','t-mute']};
async function loadMailing(){const [m,p,th]=await Promise.all([api('mailing'),api('swanmail'),api('threads')]);mlSent=m.sent;mlItems=p.items;
 const nb=$('#nb-ml');nb.textContent=p.stats.to_validate;nb.style.display=p.stats.to_validate?'':'none';
 if(mlSel&&!mlItems.some(x=>x.id==mlSel))mlSel=null;if(!mlSel)mlSel=mlItems.find(x=>['to_validate','unmatched'].includes(x.status))?.id||mlItems[0]?.id||null;
 const tabs=`<div class="tabs" role="tablist">${[['partner',`Emails partenaire${p.stats.to_validate?` (${p.stats.to_validate})`:''}`],['conv',`Conversations${th.items.filter(t=>t.status=='open'&&t.waiting_on=='nous').length?` (${th.items.filter(t=>t.status=='open'&&t.waiting_on=='nous').length})`:''}`],['tpl','Modèles'],['sent','Envoyés']].map(([k,l])=>`<button role="tab" aria-selected="${mlTab==k}" class="${mlTab==k?'on':''}" data-mltab="${k}">${l}</button>`).join('')}</div>`;
 let body='';
 if(mlTab=='tpl')body=`<div class="card"><h3>Modèles (${m.templates.length})</h3><div style="overflow:auto"><table><thead><tr><th>Modèle</th><th>Déclencheur</th><th>Destinataires</th><th class="r">Envoyés</th></tr></thead><tbody>
  ${m.templates.map(t=>`<tr><td><b>${esc(t.desc)}</b><div class="sub mono">${esc(t.rule)}</div></td><td><span class="mono">${esc(t.trigger)}</span></td><td>${esc(t.to)}</td><td class="r"><b>${t.sent}</b></td></tr>`).join('')}</tbody></table></div></div>`;
 if(mlTab=='conv')body=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Conversations Swan / nous / client (${th.items.length})</h3><span class="sub">Gmail ${th.gmail.mode=='live'?'connecté':'simulé'} · ${esc(th.gmail.address)}</span></div><table><tbody>${th.items.map(t=>`<tr><td><b>${esc(t.company_name)}</b> <span class="sub mono">${esc(t.ref)}</span><div class="sub">${esc(t.title||t.subject||'')}${t.ticket?' · #'+esc(t.ticket):''}</div></td><td><span class="pill ${t.status=='closed'?'t-ok':t.waiting_on=='nous'?'t-warn':'t-info'}">${esc(t.waiting_label)}</span></td><td class="sub">${t.n} msg</td><td class="r"><a class="btn ghost sm" href="/agent/conversation?id=${t.id}">Ouvrir</a></td></tr>`).join('')||'<tr><td class="sub">Aucune conversation : elles se créent à la réception d’un email du partenaire.</td></tr>'}</tbody></table></div>`;
 if(mlTab=='sent')body=`<div class="bgrid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)"><div class="card"><h3>Envoyés (${m.sent.length})</h3><table><tbody>${m.sent.map((x,i)=>`<tr class="row" data-ml="${i}"><td><b>${esc(x.subject)}</b><div class="sub">${esc(x.to_name)} · ${esc(x.to_role)} · ${esc(x.ref||'')} · <span class="mono">${esc(x.rule)}</span></div></td><td class="r sub">${new Date(x.created_at+'Z').toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</td></tr>`).join('')||'<tr><td class="sub">Aucun message envoyé pour l’instant.</td></tr>'}</tbody></table></div>
  <div class="card"><h3 id="ml-subj">Sélectionnez un message</h3><div class="sub" id="ml-meta"></div><pre id="ml-body" style="white-space:pre-wrap;font:inherit;margin-top:14px"></pre></div></div>`;
 if(mlTab=='partner'){const it=mlItems.find(x=>x.id==mlSel);
  body=`<div class="card sm-tools"><div class="sm-row"><div><b>Simuler un email du partenaire</b><div class="sub">Comme un email Zendesk reçu sur l’adresse dédiée, pour le dossier en cours.</div></div>
   <div class="sm-ctl"><select id="sm-kind" aria-label="Type d’email"><option value="siege">Domiciliation à refaire</option><option value="virement">Virement retourné</option><option value="identite">Pièce d’identité expirée</option><option value="activite">Activité et origine des fonds</option></select><button class="btn sm" id="sm-sim">Recevoir</button></div></div>
   <details><summary class="lnk">Coller un email réellement reçu</summary><div class="stacked" style="margin-top:10px"><input id="sm-from" placeholder="Expéditeur (ex. support@swan.zendesk.com)" aria-label="Expéditeur"><input id="sm-subj" placeholder="Objet" aria-label="Objet"><textarea id="sm-text" placeholder="Corps de l’email, avec l’identifiant du dépôt de capital" aria-label="Corps de l’email" style="min-height:140px"></textarea><div><button class="btn sm" id="sm-paste">Analyser cet email</button></div></div></details></div>
  <div class="sm-grid"><div class="card sm-list"><h3>Reçus (${mlItems.length})</h3>${mlItems.map(x=>`<button class="sm-it ${x.id==mlSel?'on':''}" data-sm="${x.id}"><span class="pill ${SM_ST[x.status][1]}">${SM_ST[x.status][0]}</span><b>${esc(x.case?x.case.ref+' · '+x.case.company_name:'Dossier inconnu')}</b><span class="sub">${esc(x.category_label)}${x.ticket?' · ticket #'+esc(x.ticket):''} · ${new Date(x.received_at+'Z').toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</span></button>`).join('')||'<div class="sub">Aucun email reçu.</div>'}</div>
   <div>${it?smDetail(it):'<div class="card sub">Sélectionnez un email.</div>'}</div></div>`}
 $('#ml-root').innerHTML=tabs+body}
function smDetail(x){const done=['sent','ignored'].includes(x.status);
 const chips=[['Dossier',x.case?`${x.case.ref} · ${x.case.company_name}`:'—'],['ID dépôt Swan',x.swan_case_id||'non trouvé'],['Ticket',x.ticket?'#'+x.ticket:'—'],['Catégorie',x.category_label],['Expéditeur',x.from_email||'—']];
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><h3 style="margin:0">${esc(x.subject||'(sans objet)')}</h3><span class="pill ${SM_ST[x.status][1]}">${SM_ST[x.status][0]}</span></div>
  <div class="kv" style="grid-template-columns:120px 1fr">${chips.map(([k,v])=>`<span>${k}</span><span class="${k=='ID dépôt Swan'?'mono':''}">${esc(v)}</span>`).join('')}</div>
  ${x.thread_id?`<div style="margin:8px 0"><a class="btn ghost sm" href="/agent/conversation?id=${x.thread_id}">Ouvrir la conversation Swan / nous / client</a></div>`:''}<details ${done?'':'open'}><summary class="lnk">Email d’origine (interne)</summary><pre class="sm-orig">${esc(x.body)}</pre></details></div>
 ${x.warnings.length?`<div class="warn bad" style="margin:0 0 16px"><b>À vérifier avant l’envoi</b><br>• ${x.warnings.map(esc).join('<br>• ')}</div>`:''}
 ${x.status=='unmatched'?`<div class="card"><h3>Rattacher à un dossier</h3><div class="sub" style="margin-bottom:10px">Aucun dossier trouvé à partir de l’identifiant. Choisissez-le pour générer le brouillon.</div><div class="sm-ctl"><select id="sm-case" aria-label="Dossier">${(capV?.history||[]).map(h=>`<option value="${h.id}">${esc(h.ref)} · ${esc(h.company_name)}</option>`).join('')}</select><button class="btn sm" data-sm-attach="${x.id}">Rattacher</button><button class="btn ghost sm" data-sm-ignore="${x.id}">Ignorer</button></div></div>`:''}
 ${x.status=='to_validate'?`<div class="card"><h3>Message au client (brouillon à valider)</h3><div class="stacked">
   <div><label for="sm-to">Destinataire</label><select id="sm-to">${x.recipients.map(r=>`<option value="${esc(r.email)}" ${r.email==x.to_email?'selected':''}>${esc(r.name)} (${r.role}) · ${esc(r.email)}</option>`).join('')}</select></div>
   <div><label for="sm-s">Objet</label><input id="sm-s" value="${esc(x.draft_subject)}"></div>
   <div><label for="sm-b">Message</label><textarea id="sm-b" style="min-height:280px">${esc(x.draft_body)}</textarea></div></div>
   <div class="acts"><button class="btn" data-sm-send="${x.id}">Valider et envoyer</button><button class="btn ghost" data-sm-ignore="${x.id}">Ignorer</button></div></div>`:''}
 ${x.status=='sent'?`<div class="card"><h3>Envoyé à ${esc(x.to_name)}</h3><div class="sub">Validé par ${esc(x.validated_by)} le ${new Date(x.sent_at+'Z').toLocaleString('fr-FR')}</div><div class="sub" style="margin-top:6px"><b>${esc(x.draft_subject)}</b></div><pre style="white-space:pre-wrap;font:inherit;margin-top:10px">${esc(x.draft_body)}</pre></div>`:''}
 ${x.status=='ignored'?`<div class="card sub">Ignoré : ${esc(x.ignored_reason||'')}</div>`:''}`}
$('#ml-root').addEventListener('click',async e=>{const r=e.target.closest('[data-ml]');if(r){const x=mlSent[+r.dataset.ml];$('#ml-subj').textContent=x.subject;$('#ml-meta').textContent=`À : ${x.to_name} <${x.to_email}> · modèle ${x.rule}`;$('#ml-body').textContent=x.body;return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mltab){mlTab=b.dataset.mltab;loadMailing();return}
 if(b.dataset.sm){mlSel=+b.dataset.sm;loadMailing();return}
 try{
  if(b.id=='sm-sim'){const it=await call('swanmail/simulate',{kind:$('#sm-kind').value});mlSel=it.id;toast('Email du partenaire reçu : brouillon prêt à valider')}
  else if(b.id=='sm-paste'){const it=await call('swanmail/inbound',{from:$('#sm-from').value,subject:$('#sm-subj').value,text:$('#sm-text').value});mlSel=it.id;toast(it.status=='unmatched'?'Email reçu, dossier non trouvé':'Email analysé : brouillon prêt')}
  else if(b.dataset.smSend){b.disabled=true;await call(`swanmail/${b.dataset.smSend}/send`,{to_email:$('#sm-to').value,subject:$('#sm-s').value,body:$('#sm-b').value});toast('Message validé et envoyé au client')}
  else if(b.dataset.smIgnore){await call(`swanmail/${b.dataset.smIgnore}/ignore`,{reason:'Sans suite'});toast('Email ignoré')}
  else if(b.dataset.smAttach){const it=await call(`swanmail/${b.dataset.smAttach}/attach`,{caseId:$('#sm-case').value});mlSel=it.id;toast('Email rattaché : brouillon prêt')}
  else return;
  loadMailing();}catch{b.disabled=false}});
$('aside a[data-t=mailing]').addEventListener('click',async()=>{if(!capV){const v=await api('capital');if(v.case)capV=v}loadMailing()});
api('swanmail').then(p=>{const nb=$('#nb-ml');nb.textContent=p.stats.to_validate;nb.style.display=p.stats.to_validate?'':'none'});
api('config').then(c=>{$('#mode').textContent='Mode '+c.mode.toUpperCase()+' · API Swan';$('#main-link').href=c.mainUrl});
if(location.hash=='#mailing'){go('mailing');api('capital').then(v=>{if(v.case)capV=v;loadMailing()})}else loadCapital(new URLSearchParams(location.search).has('new'));
</script></body></html>
