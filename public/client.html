<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Pro – Votre dépôt de capital</title>
<link rel="stylesheet" href="/nova.css">
<style>
body{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--side);color:#fff;flex-wrap:wrap}
.top .logo{display:flex;align-items:center;gap:8px;font-weight:700}.top .logo i{width:18px;height:18px;border-radius:5px;background:#fff;display:inline-block}
.as{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--sideink);min-width:0;max-width:100%}.as select{width:auto;max-width:100%;min-width:0;padding:6px 10px;font-size:12.5px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.co{margin-bottom:18px}.note{font-size:12px;color:var(--mute);margin:8px 4px 0}
.co h1{font-size:22px;letter-spacing:-.02em;margin:2px 0 0}
.now{border:2px solid var(--ink);padding:24px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.now h2{font-size:21px;margin:6px 0 6px}.now .why{color:#3d3d38;margin:0 0 14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-bottom:16px}.meta b{color:var(--ink)}
.now .btn{padding:12px 20px;font-size:15px}
.then{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}.then li{margin:4px 0}
.ibanbox{background:var(--bg);border-radius:10px;padding:14px;margin:0 0 14px;display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13.5px}
.ibanbox span:nth-child(odd){color:var(--mute)}.mono{font-family:ui-monospace,Menlo,monospace}
.rules{font-size:12.5px;color:#3d3d38;margin:0 0 14px;padding-left:18px}.rules li{margin:3px 0}
.wl{list-style:none;margin:0;padding:0}.wl li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.wl li:first-child{border-top:0;padding-top:0}
.wl .t{flex:1;min-width:0}.wl .s{font-size:12.5px;color:var(--mute)}.wl .late{color:var(--ko);font-weight:600}
.who{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gray);font-weight:700;font-size:12px;flex:none}
.who.team{background:#e4ecff;color:#2845b8}.who.notary{background:#efe6ff;color:#5b3df5}
.prog{height:6px;border-radius:99px;background:var(--gray);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.ok-ic{color:var(--ok);font-weight:700}
.now.wait{border-color:#e2c26a;background:#fffdf5}.now.wait .eyebrow{color:var(--warn)}.now.done{border-color:var(--ok);background:#f6fcf8}.now.done .eyebrow{color:var(--ok)}
.after{font-size:12.5px;color:var(--mute);margin-top:14px}.after:empty{display:none}
.rules.ok{list-style:none;padding:0}.rules.ok li{padding-left:20px;position:relative}.rules.ok li:before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:700}.rules.ok li.x:before{content:"!";color:var(--ko)}
.zone{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px}
.frise{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
.st{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:14px 0}.st+.st,.fold+.st{border-top:1px solid var(--line)}
.jd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--gray);color:var(--mute)}
.st.done .jd{background:var(--ok);color:#fff}.st.cur .jd{background:var(--ink);color:#fff;box-shadow:0 0 0 4px #e3e3de}.st.goal .jd{background:#fff;border:2px solid var(--accent);color:var(--accent)}
.st.cur.goal .jd{background:var(--accent);color:#fff;border:0}
.st b{display:block}.st .s{font-size:12.5px;color:var(--mute)}.st.todo b{color:#55554f;font-weight:600}
.when{text-align:right;font-size:12.5px;color:var(--mute);white-space:nowrap}.when b{color:var(--ink)}.st.goal .when b{font-size:17px;color:var(--accent);letter-spacing:-.01em}
.sub-l{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}.sub-l li{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sub-l .ok{color:var(--ok);font-weight:600}.sub-l .wt{color:var(--warn);font-weight:600}.sub-l .ko{color:var(--ko);font-weight:600}.sub-l .lnk{font-size:12px;margin-left:6px}
.fold{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 0;border:0;background:none;font:inherit;cursor:pointer;color:var(--mute);font-size:13px;text-align:left}.fold b{color:var(--ok)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.acc details+details{border-top:1px solid var(--line)}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 20px;cursor:pointer;font-weight:600}.acc summary::-webkit-details-marker{display:none}
.acc summary span{margin-left:auto;font-size:12.5px;color:var(--mute);font-weight:400}.acc summary:after{content:"›";font-size:18px;color:var(--mute);transition:transform .15s}.acc details[open] summary:after{transform:rotate(90deg)}
.acc .in{padding:0 20px 16px;font-size:13px}.acc textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:70px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.rw:first-child{border-top:0}
.msg{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px}.msg .s{font-size:11.5px;color:var(--mute)}
.steps{display:flex;gap:6px;margin:0 0 8px}.steps div{flex:1;font-size:11.5px;color:var(--mute)}.steps i{display:block;height:4px;border-radius:9px;background:var(--gray);margin-bottom:5px}
.steps .d{color:var(--ok)}.steps .d i{background:var(--ok)}.steps .c{color:var(--ink);font-weight:700}.steps .c i{background:var(--ink)}.steps .ko{color:var(--ko)}.steps .ko i{background:var(--ko)}
.mine{font-size:12.5px;color:var(--mute);margin-bottom:14px}.mine b{color:var(--ink)}
.follow{text-align:center;margin:18px 0 12px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:40px 20px}
@media(max-width:600px){.st{grid-template-columns:26px 1fr}.when{grid-column:2;text-align:left}.ibanbox{grid-template-columns:1fr}.now{padding:18px}}
</style></head><body>
<div class="top"><a class="logo" href="/" title="Accueil" style="color:#fff;text-decoration:none"><i></i>Nova Pro</a>
 <div class="as"><span>Maquette · client</span><select id="co" aria-label="Changer de client (dossier)"></select><span>vu par</span><select id="as" aria-label="Voir la page en tant que"></select><a href="/" style="color:var(--sideink)">Accueil</a> <a href="/agent" style="color:var(--sideink)">Console formaliste ›</a></div></div>
<div class="wrap" id="root"><div class="card empty sub">Chargement…</div></div>

<dialog id="cap-doc-dlg"><div style="padding:28px"><div id="cd-head"></div><div id="cd-checks" style="margin:12px 0"></div><div id="cd-seen" class="stacked" style="display:grid;gap:10px"></div>
 <div style="margin:12px 0"><label for="cd-file">Fichier (pdf, png ou jpg, 5 Mo max)</label><input type="file" id="cd-file" accept=".pdf,.png,.jpg,.jpeg"></div><div id="cd-warn"></div>
 <div class="acts"><button class="btn ghost" onclick="this.closest('dialog').close()">Annuler</button> <button class="btn" id="cd-send" disabled>Envoyer</button></div></div></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>fetch('/api/'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>r.json());
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
const capE=x=>(x/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const ini=s=>String(s).split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const qs=new URLSearchParams(location.search);
let V=null,asId=Number(qs.get('as'))||null,NOW=new Date();
// Dates : « jeu. 4 déc. » + relatif (« demain », « dans 3 j »)
const day=d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const dayDiff=d=>{const a=new Date(NOW);a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)};
const rel=d=>{const n=dayDiff(d);return n==0?'aujourd’hui':n==1?'demain':n==-1?'hier':n>0?`dans ${n} j`:`il y a ${-n} j`};
const ago=d=>{const n=-dayDiff(d);return n<=0?'depuis aujourd’hui':n==1?'depuis hier':`depuis ${n} jours`};
const WHO={team:'Notre équipe',notary:'Le notaire'};

async function load(){const id=qs.get('id');V=await api('capital'+(id?'?id='+id:''));loadCos();NOW=new Date(V.plan?.now||Date.now());render();if(V.case)loadMsgs(V.shareholders.find(s=>s.id==asId))}
// Blocs repliables : on garde ouverts ceux que la personne a ouverts, d'un rendu à l'autre
const OPEN=new Set();let showDone=false,showFollow=false;
document.addEventListener('toggle',e=>{const k=e.target.dataset?.k;if(k)e.target.open?OPEN.add(k):OPEN.delete(k)},true);
const op=k=>`data-k="${k}" ${OPEN.has(k)?'open':''}`;
const PAID=['CapitalTransferred','CapitalFundsWiredToNotary'];

// Trois zones : 1. ce qu'il faut faire maintenant, 2. où en est le dossier (frise unique avec les dates), 3. le dossier replié
function render(){
 if(!V.case){$('#root').innerHTML='<div class="card empty"><h3>Aucun dossier de dépôt de capital</h3><div class="sub">Créez-en un depuis la console formaliste ou l’atelier.</div></div>';return}
 const c=V.case,S=V.shareholders,p=V.plan;
 if(!asId||!S.some(s=>s.id==asId))asId=S.find(s=>s.is_admin)?.id||S[0].id;
 const me=S.find(s=>s.id==asId),founder=!!me.is_admin;
 $('#as').innerHTML=S.map(s=>`<option value="${s.id}" ${s.id==asId?'selected':''}>${esc(s.name)} (${s.is_admin?'fondateur':'associé'})</option>`).join('');
 const mine=p.todos[me.id]||[];
 // Ce qu'on attend des autres : actions des autres associés + notre équipe / notaire
 const others=S.filter(s=>s.id!=me.id).flatMap(s=>(p.todos[s.id]||[]).map(t=>({...t,who:s.name,sh:s,title:t.title.replace(/votre/g,'son')})));
 const waits=[...others,...p.waiting.map(w=>({...w,who:WHO[w.who],kind:w.who}))];
 const closed=['Completed','Canceled'].includes(c.status);
 const head=`<div class="co"><div class="sub">${founder?'Dépôt de capital · '+capE(c.total_cents):`Bonjour ${esc(me.name.split(' ')[0])} · associé de`}</div><h1>${esc(c.company_name)}</h1></div>`;
 const next=nextCard(c,me,mine,waits,others,founder);
 if(closed){$('#root').innerHTML=head+next+`<div class="acc" style="margin-top:16px">${histDetails()}</div>`;return}
 $('#root').innerHTML=head+(founder?'':mySteps(me))+next+
  (founder?`<div class="zone">Où en est le dossier</div>${frise(c,p,founder)}`
   :`<div class="follow"><button class="lnk" data-follow>${showFollow?'Masquer le dossier de la société':'Suivre le dossier de la société'}</button></div>${showFollow?frise(c,p,founder):''}`)+
  `<div class="zone">${founder?'Mon dossier':'Mes informations'}</div><div class="acc">${founder?sharesDetails(c,S):''}${docsDetails(c,me,founder)}${msgsCard(me)}${founder?histDetails():''}</div>`;
}
// Associé : son propre parcours en quelques étapes, sans tableau de bord
function mySteps(me){const mine=V.documents.filter(d=>d.shareholder_id==me.id&&!d.notary),idd=mine.find(d=>d.kyc),dom=mine.find(d=>!d.kyc);
 const st=d=>!d?'todo':d.status=='Refused'?'ko':['Validated','Uploaded'].includes(d.status)?'d':'todo';
 const L=[['Signature',me.signed_at?'d':'todo'],['Identité',st(idd)],['Domicile',st(dom)],['Virement',PAID.includes(me.status)?'d':'todo']];
 const cur=L.findIndex(x=>x[1]!='d');
 return `<div class="steps">${L.map(([l,s],i)=>`<div class="${s=='d'?'d':i==cur?(s=='ko'?'c ko':'c'):''}"><i></i>${l}${s=='d'?' ✓':''}</div>`).join('')}</div>
  <div class="mine">Votre apport : <b>${capE(me.amount_cents)}</b> · ${esc(me.label)}</div>`}
// 1. La prochaine action, et une seule mise en avant
// Quand c'est un autre associé qui bloque : on le dit clairement, avec le motif et (pour le fondateur) une relance
// « Remplacer : Justificatif de domicile » → « remplacer son justificatif de domicile »
const POSS={'Pièce d’identité':'sa','Statuts':'ses'};
const phrase=t=>{const d=t.docId&&V.documents.find(x=>x.id==t.docId);if(d){const p=POSS[d.label]||'son',l=d.label.charAt(0).toLowerCase()+d.label.slice(1);return `${t.urgent?'remplacer':'déposer'} ${p} ${l}`}
 return t.title.replace(/votre/g,'son').replace(/^./,x=>x.toLowerCase())};
const lastRemind=sh=>V.messages.filter(m=>m.rule=='relance'&&m.to_email==sh.email).map(m=>m.created_at)[0];
function blockedCard(others,founder){const t=others[0],sh=t.sh,first=sh.name.split(' ')[0],lr=lastRemind(sh);
 const canRemind=founder&&V.actions.some(a=>a.id=='remind:'+sh.id);
 return `<div class="card now wait"><div class="eyebrow">${founder?'En attente de '+esc(first):t.urgent?'Dossier en pause':'En attente d’un associé'}</div>
  <h2>${esc(first)} doit ${esc(phrase(t))}</h2>
  ${t.why&&t.urgent?`<p class="why"><b>Motif :</b> ${founder?`${esc(V.documents.find(x=>x.id==t.docId)?.explanation?.title||t.why)}. ${esc(first)} a reçu un email avec la marche à suivre.`:esc(t.why)}</p>`:''}
  <div class="meta">${t.since?`<span>En attente <b>${ago(t.since)}</b></span>`:''}${lr?`<span>Dernière relance : <b>${rel(lr.replace(' ','T')+'Z')}</b></span>`:''}${founder?'':'<span>Le fondateur suit ce point.</span>'}</div>
  ${canRemind?`<button class="btn ghost" data-act="remind:${sh.id}">Relancer ${esc(first)}</button>`:''}
  <div class="after">${others.length>1?`Aussi attendu : ${others.slice(1).map(o=>`${esc(o.who.split(' ')[0])} doit ${esc(phrase(o))}`).join(' · ')}. `:''}Le dossier reprend dès que c’est fait.</div></div>`}
function nextCard(c,me,mine,waits,others,founder){
 if(c.status=='Completed')return `<div class="card now done"><div class="eyebrow">Dossier terminé</div><h2>Vos ${capE(c.total_cents)} sont sur votre compte pro</h2><p class="why">Versés le ${day(c.completed_at).replace(/\.$/,'')}. La société peut démarrer son activité.</p><a class="btn ghost" target="_blank" href="/api/capital/${c.id}/certificate.pdf">Télécharger l’attestation de dépôt</a></div>`;
 if(c.status=='Canceled')return `<div class="card now"><div class="eyebrow">Dossier arrêté</div><h2>${c.cancel_sensitive?'Ce dossier ne peut pas aboutir':'Dossier annulé'}</h2><p class="why">${c.cancel_sensitive?'Un conseiller va vous contacter pour vous expliquer la suite, notamment pour les fonds déjà versés.':esc(c.cancel_label||c.cancel_note||'')}</p></div>`;
 if(!mine.length&&others.length)return blockedCard(others.sort((a,b)=>!!b.urgent-!!a.urgent),founder);
 if(!mine.length){const w=waits.find(x=>x.kind)||waits[0];
  return `<div class="card now"><div class="eyebrow">Rien à faire de votre côté</div><h2>${w?esc(w.who)+' : '+esc(w.title.charAt(0).toLowerCase()+w.title.slice(1)):'Votre dossier avance'}</h2>
   <p class="why">${w?.due?(w.late?`Cette étape prend plus de temps que prévu (initialement le ${day(w.due)}) : nous avons relancé. Les dates ci-dessous en tiennent compte.`:`Réponse attendue d’ici le <b>${day(w.due)}</b> (${rel(w.due)}).`):'Nous vous prévenons par email dès qu’une action est attendue de vous.'}</p>
   <div class="after">Vous recevrez un email à chaque étape.</div></div>`}
 const t=mine[0],rest=mine.slice(1);
 let body='';
 if(t.kind=='transfer')body=`<div class="ibanbox"><span>IBAN</span><span><b class="mono">${esc(t.iban)}</b> <button class="lnk" data-copy="${esc(t.iban)}">Copier</button></span><span>Montant</span><span><b>${capE(t.amount_cents)}</b> exactement</span><span>Bénéficiaire</span><span>${esc(me.name)}</span><span>Libellé</span><span class="mono">${esc(c.ref)}</span></div>
  <ul class="rules ok"><li>Depuis un compte bancaire <b>à votre nom</b> (pas celui d’un proche ni d’une société)</li><li>Virement instantané conseillé : reçu en quelques secondes (sinon 1 jour ouvré)</li>${t.refusals?`<li class="x"><b style="color:var(--ko)">Votre virement précédent a été refusé</b> : refaites-le depuis un compte à votre nom</li>`:''}</ul>`;
 if(t.kind=='sign')body=`<ul class="rules" style="list-style:none;padding:0">${t.docs.map(d=>`<li>📄 <a target="_blank" href="${esc(V.documents.find(x=>x.id==d.id)?.preview||'#')}">${esc(d.label)}</a> <span class="sub">· préparé à partir de votre dossier</span></li>`).join('')}</ul>`;
 if(t.kind=='register')body=`<ol class="rules"><li>Téléchargez l’attestation de dépôt des fonds.</li><li>Déposez votre demande d’immatriculation sur le guichet unique en la joignant.</li><li>Dès réception de l’extrait Kbis, déposez-le ici : le capital est viré sous ${V.plan.sla.release} jours ouvrés.</li></ol>`;
 const btn=t.kind=='sign'?`<button class="btn" data-act="${t.act}">Signer électroniquement</button>`
  :t.kind=='kyc'?`<button class="btn" data-act="${t.act}">${t.urgent?'Refaire la vérification':'Commencer la vérification'}</button>`
  :t.kind=='doc'?`<button class="btn" data-doc="${t.docId}">${t.urgent?'Déposer la nouvelle version':'Déposer le document'}</button>`
  :t.kind=='transfer'?`<button class="btn" data-act="${t.act}">J’ai fait le virement</button> <span class="sub">Maquette : simule l’arrivée des fonds</span>`
  :t.kind=='answer'?`<button class="btn" data-act="answer">J’ai envoyé le complément</button>`
  :t.kind=='register'?`<a class="btn" target="_blank" href="${t.href}">Télécharger l’attestation</a>`:'';
 const unlock={sign:'Envoyés pour vérification dès que tous les associés ont signé',kyc:'Débloque votre IBAN de dépôt',transfer:'Votre apport sera reçu sous 1 jour ouvré',doc:'Vérifié sous '+V.plan.sla.docCheck+' jour ouvré',answer:'Vérification reprise sous '+V.plan.sla.review+' jours ouvrés',register:'Délai habituel du greffe : environ '+V.plan.sla.registration+' jours ouvrés'}[t.kind];
 return `<div class="card now" id="next"><div class="eyebrow">${t.urgent?'<span style="color:var(--ko)">À corriger</span>':'À faire maintenant'}${mine.length>1?` · 1 sur ${mine.length}`:''}</div>
  <h2>${esc(t.title)}</h2><p class="why">${esc(t.why||'')}</p>
  ${t.duration?`<div class="meta"><span>⏱ <b>${t.duration}</b></span></div>`:''}
  ${body}${btn}
  <div class="after">${unlock?'Ensuite : '+unlock.charAt(0).toLowerCase()+unlock.slice(1)+'.':''}${rest.length?` Puis : ${rest.map(r=>esc(r.title.charAt(0).toLowerCase()+r.title.slice(1))).join(', ')}.`:''}</div></div>`}

// 2. Une seule frise : les étapes, qui doit agir sur l'étape en cours, et les dates (les deux qui comptent en évidence)
const SHORT=t=>{const d=t.docId&&V.documents.find(x=>x.id==t.docId);
 return {sign:'Signature à faire',kyc:'Identité à vérifier',transfer:'Apport à virer',answer:'Complément à envoyer',register:'Kbis à déposer'}[t.kind]||(d?`${d.label} ${t.urgent?'à remplacer':'à déposer'}`:t.title)};
const OKL={docs:'Signé',kyc:'Vérifié',pay:'Reçu'};
function frise(c,p,founder){const st=V.steps,S=V.shareholders,done=st.filter(s=>s.state=='done'),paused=S.some(s=>(p.todos[s.id]||[]).some(t=>t.urgent));
 const row=(s,i)=>{const goal=s.goal||s.key=='release',cur=s.state=='current';
  const when=s.state=='done'?(s.done_at?day(s.done_at):'fait'):goal?`${cur?'prévue':'estimée'}<br><b>${s.eta?day(s.eta):'—'}</b>`:cur?(paused?'en pause':s.eta?'prévue '+day(s.eta):'en cours'):s.eta?'estimée<br>'+day(s.eta):'';
  const n=st.slice(0,i+1).filter(x=>!(x.goal||x.key=='release')).length;   // les jalons (★) ne prennent pas de numéro
  return `<div class="st ${s.state=='done'?'done':cur?'cur':'todo'}${goal&&s.state!='done'?' goal':''}"><span class="jd">${s.state=='done'?'✓':goal?'★':n}</span><div><b>${esc(s.key=='release'?'Capital sur votre compte pro':s.title)}</b><span class="s">${esc(s.desc)}</span>${cur?detail(s,p,founder):''}</div><div class="when">${when}</div></div>`};
 const fold=done.length>=2&&done.length<st.length;
 const late=p.waiting.filter(w=>w.late);
 return `<div class="frise">${fold?`<button class="fold" data-fold><span><b>✓</b> ${done.length} étapes terminées · ${done.map(s=>esc(s.title.charAt(0).toLowerCase()+s.title.slice(1))).join(', ')}</span><span>${showDone?'Masquer':'Voir'}</span></button>`:''}
  ${st.map((s,i)=>fold&&s.state=='done'&&!showDone?'':row(s,i)).join('')}
  ${late.length?`<div class="note" style="margin:4px 0 14px">${late.map(w=>`« ${esc(w.title)} » prend plus de temps que prévu (initialement le ${day(w.due)}) : nous avons relancé.`).join('<br>')}</div>`:''}</div>
  <div class="note">Dates estimées si chaque action en attente est faite aujourd’hui, mises à jour à chaque étape.</div>`}
// Sur l'étape en cours : chaque associé (avec son statut) et les tiers attendus
function detail(s,p,founder){const S=V.shareholders,all=['docs','kyc','pay'].includes(s.key);
 const K={docs:['sign'],kyc:['kyc','doc'],pay:['transfer']}[s.key],pick=sh=>(p.todos[sh.id]||[]).find(t=>!K||K.includes(t.kind));
 const L=S.filter(sh=>all||pick(sh)).map(sh=>{const t=pick(sh),me=sh.id==asId;
  const remind=founder&&!me&&t&&V.actions.some(a=>a.id=='remind:'+sh.id)?` <button class="lnk" data-act="remind:${sh.id}">Relancer</button>`:'';
  return `<li><span>${esc(sh.name)}${me?' (vous)':''}${s.key=='pay'?' · '+capE(sh.amount_cents):''}</span><span class="${t?(t.urgent?'ko':'wt'):'ok'}">${t?esc(SHORT(t)):(OKL[s.key]||'OK')+' ✓'}${remind}</span></li>`});
 const W=p.waiting.map(w=>`<li><span>${esc(WHO[w.who])} · ${esc(w.title.charAt(0).toLowerCase()+w.title.slice(1))}</span><span class="wt">${w.due?(w.late?'relancé':'d’ici le '+day(w.due)):''}</span></li>`);
 return L.length||W.length?`<ul class="sub-l">${L.join('')}${W.join('')}</ul>`:''}

// 3. Le dossier, replié
function sharesDetails(c,S){const pct=c.total_cents?Math.round(V.funded/c.total_cents*100):0;
 return `<details ${op('shares')}><summary>Apports des associés<span>${capE(V.funded)} reçus sur ${capE(c.total_cents)}</span></summary><div class="in"><div class="prog"><i style="width:${pct}%"></i></div>
  ${S.map(s=>`<div class="rw"><span>${esc(s.name)}${s.id==asId?' (vous)':''} · <b>${capE(s.amount_cents)}</b></span><span class="sub">${esc(s.label)}</span></div>`).join('')}</div></details>`}
let MSGS=[];
async function loadMsgs(me){MSGS=await api(`client-messages?caseId=${V.case.id}&email=${encodeURIComponent(me.email)}`);const el=$('#msgs');if(el)el.outerHTML=msgsCard(me)}
function msgsCard(me){
 return `<details id="msgs" ${op('msgs')}><summary>Messages de l’équipe<span>${MSGS.length?MSGS.length+' message'+(MSGS.length>1?'s':''):'aucun'}</span></summary><div class="in">
  ${MSGS.map(m=>`<div class="msg"><div class="s">${m.lane=='nous'?'Nova Pro':'Vous'} · ${new Date(m.created_at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`).join('')||'<div class="sub" style="margin-bottom:10px">Aucun message pour l’instant.</div>'}
  <label for="m-reply">Écrire à l’équipe</label><textarea id="m-reply" placeholder="Votre message"></textarea><div style="margin-top:8px"><button class="btn sm" id="m-send">Envoyer</button> <span class="sub">En vrai, il suffit de répondre à l’email reçu.</span></div></div></details>`}
function docsDetails(c,me,founder){const ds=V.documents.filter(d=>!d.notary&&(d.shareholder_id==me.id||(founder&&!d.shareholder_id)));
 const st=d=>d.generated&&d.status=='Pending'?`<span class="pill t-warn">À signer · ${V.shareholders.filter(x=>x.signed_at).length}/${V.shareholders.length}</span>`:d.generated&&d.status=='Refused'?'<span class="pill t-info">Nouvelle version en préparation</span>':d.status=='Validated'?'<span class="ok-ic">✓ Validé</span>':d.status=='Refused'?'<span class="pill t-ko">Refusé</span>':d.status=='Uploaded'?'<span class="pill t-info">En vérification</span>':'<span class="pill t-warn">À déposer</span>';
 const ok=ds.filter(d=>d.status=='Validated').length,todo=ds.length-ok;
 return `<details ${op('docs')}><summary>${founder?'Documents dont vous êtes responsable':'Vos documents'}<span>${[todo?todo+' en cours':'',ok?ok+' validé'+(ok>1?'s':''):''].filter(Boolean).join(' · ')}</span></summary><div class="in"><table><tbody>${ds.map(d=>`<tr><td>${esc(d.label)}${d.generated?`<div class="sub">Préparé par Nova Pro · <a target="_blank" href="${esc(d.preview)}">voir</a></div>`:d.shareholder_id?'':'<div class="sub">'+esc(c.company_name)+'</div>'}${d.explanation&&!d.generated?`<div class="sub" style="color:var(--ko)">${esc(d.explanation.title)} : ${d.explanation.note?esc(d.explanation.note).replace(/\n/g,'<br>'):esc(d.explanation.fix)}</div>`:''}</td><td class="r">${st(d)}${d.uploadable?` <button class="btn sm" data-doc="${d.id}">${d.status=='Refused'?'Remplacer':'Déposer'}</button>`:''}</td></tr>`).join('')}</tbody></table></div></details>`}
function histDetails(){return `<details ${op('hist')}><summary>Historique du dossier<span>${V.timeline.length} événement${V.timeline.length>1?'s':''}</span></summary><div class="in">${V.timeline.map(e=>`<div class="rw"><span>${esc(e.text)}</span><span class="sub">${new Date(e.created_at+'Z').toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')}</div></details>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fold],[data-follow]');if(!b)return;if(b.dataset.fold!==undefined)showDone=!showDone;else showFollow=!showFollow;render()});
// Actions
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('IBAN copié')}catch{toast(b.dataset.copy)}return}
 if(b.dataset.doc){openDoc(+b.dataset.doc);return}
 if(b.dataset.act){b.disabled=true;const r=await api(`capital/${V.case.id}/act`,{action:b.dataset.act});if(r.error){toast(r.error);b.disabled=false;return}
  V=r;NOW=new Date(r.plan.now);render();toast(b.dataset.act.startsWith('remind')?'Relance envoyée':'C’est noté');scrollTo({top:0,behavior:'smooth'})}});
// Changer de client : liste des dossiers, on recharge la vue sur le dossier choisi (vu par son fondateur)
async function loadCos(){const Q=await api('capital/queue');if(!Array.isArray(Q))return;
 $('#co').innerHTML=Q.map(q=>`<option value="${q.id}" ${q.id==V.case?.id?'selected':''}>${esc(q.company_name)} · ${esc(q.label||q.status)}</option>`).join('');$('#co').hidden=!Q.length}
$('#co').onchange=e=>{const u=new URL(location);u.searchParams.set('id',e.target.value);u.searchParams.delete('as');history.replaceState(null,'',u);
 qs.set('id',e.target.value);asId=null;MSGS=[];OPEN.clear();showDone=showFollow=false;$('#root').innerHTML='<div class="card empty sub">Chargement…</div>';load()};
$('#as').onchange=e=>{asId=+e.target.value;const u=new URL(location);u.searchParams.set('as',asId);history.replaceState(null,'',u);MSGS=[];render();loadMsgs(V.shareholders.find(s=>s.id==asId))};
document.addEventListener('click',async e=>{if(e.target.id!='m-send')return;const me=V.shareholders.find(s=>s.id==asId),txt=$('#m-reply').value.trim();if(!txt)return;
 const r=await api('client-messages/reply',{caseId:V.case.id,email:me.email,text:txt});if(r.error)return toast(r.error);MSGS=r;$('#msgs').outerHTML=msgsCard(me);toast('Message envoyé')});
// Dépôt de document : points de contrôle + cohérence avec le dossier (comme dans l'atelier)
let doc=null,force=false;
function openDoc(id){const d=V.documents.find(x=>x.id==id);doc=d;const r=d.rule||{checks:[]};
 $('#cd-head').innerHTML=`<h3 style="margin:0">${esc(d.label)}</h3><div class="sub">${esc(d.owner)}</div>${d.explanation?`<div class="warn bad" style="margin:10px 0 0"><b>Refus précédent : ${esc(d.explanation.title)}</b><br>${esc(d.explanation.fix)}</div>`:''}`;
 $('#cd-checks').innerHTML='<b>Avant d’envoyer, vérifiez :</b>'+r.checks.map(c=>`<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:8px 0 0"><input type="checkbox" class="cd-ck" style="width:auto;margin-top:3px"><span>${esc(c)}</span></label>`).join('');
 const need=r.declared;$('#cd-seen').innerHTML=need=='address'||need=='companyAddress'?`<div><label for="cd-address">Adresse figurant sur le document</label><input id="cd-address" placeholder="Recopiez l’adresse telle qu’elle apparaît"></div>`:need=='company'?`<div><label for="cd-name">Raison sociale figurant sur le document</label><input id="cd-name" placeholder="Recopiez-la telle qu’elle apparaît"></div>`:'';
 $('#cd-file').value='';$('#cd-warn').innerHTML='';force=false;$('#cd-send').textContent='Envoyer';ck();$('#cap-doc-dlg').showModal()}
const ck=()=>{$('#cd-send').disabled=![...document.querySelectorAll('.cd-ck')].every(x=>x.checked)||!$('#cd-file').files[0]};
$('#cd-checks').addEventListener('change',ck);$('#cd-file').addEventListener('change',ck);
$('#cd-send').onclick=async()=>{const f=$('#cd-file').files[0];
 const o=await api(`capital/${V.case.id}/docs/${doc.id}`,{filename:f.name,size:f.size,confirmed:true,force,seen:{address:$('#cd-address')?.value,name:$('#cd-name')?.value}});
 if(o.warnings?.length){$('#cd-warn').innerHTML=`<div class="warn bad"><b>Écart avec votre dossier</b><br>• ${o.warnings.map(esc).join('<br>• ')}<br><span class="sub">Corrigez, ou envoyez quand même (risque de refus).</span></div>`;force=true;$('#cd-send').textContent='Envoyer quand même';return}
 if(o.error){$('#cd-warn').innerHTML=`<div class="warn bad">${esc(o.error)}</div>`;return}
 $('#cap-doc-dlg').close();V=o;NOW=new Date(o.plan.now);render();toast('Document envoyé, vérification sous 1 jour ouvré')};
load();
</script></body></html>
