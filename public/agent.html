<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Pro – Console formaliste</title>
<link rel="stylesheet" href="/nova.css">
<style>
body{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--side);color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top .logo{display:flex;align-items:center;gap:8px;font-weight:700}.top .logo i{width:18px;height:18px;border-radius:5px;background:#fff;display:inline-block}
.top .logo small{font-weight:500;color:var(--sideink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--sideink)}.tools a{color:var(--sideink)}
.tools .btn.ghost{background:#1b1b1b;color:#fff;border-color:#333}.clock{padding:4px 9px;border-radius:99px;background:#262626;color:#fff}.clock.shifted{background:var(--warn)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding:18px 20px;align-items:start;max-width:1500px;margin:0 auto}
.q{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;padding:14px}
.qtabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}.qtabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.qtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qi{display:grid;gap:4px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.qi:hover{background:var(--bg)}.qi.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.qi .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.qi .sub{font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--gray);color:#4a4a45}
.chip.me{background:var(--ink);color:#fff}.chip.late{background:var(--kobg);color:var(--ko)}.chip.cl{background:var(--warnbg);color:var(--warn)}.chip.pt{background:#e4ecff;color:#2845b8}.chip.nt{background:#efe6ff;color:#5b3df5}.chip.ok{background:var(--okbg);color:var(--ok)}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hd h2{font-size:20px}.kv2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.kv2>div{background:var(--bg);border-radius:10px;padding:10px 12px}.kv2 .v{font-weight:700;margin-top:2px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sees{border-left:3px solid var(--accent);background:#f4f1ff;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;margin-top:14px}
.rv{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.rv.focus{border-color:var(--ink)}
.rvh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.rvg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.ck label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;font-size:13px}.ck input{width:auto;margin-top:3px}
.decl{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}.decl div{margin:4px 0}.decl span{color:var(--mute);display:block;font-size:11.5px}
.file{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}.file i{width:30px;height:38px;border-radius:4px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:var(--ko)}
.dec{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dec .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dec select{width:auto;flex:1;min-width:200px}
.dec textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-height:60px}
.preview{font-size:12.5px;background:var(--kobg);color:var(--ko);border-radius:8px;padding:8px 10px}
.hist{font-size:12px;color:var(--mute);margin-top:8px}.hist b{color:var(--ink)}
.wl{list-style:none;margin:0;padding:0}.wl li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.wl li:first-child{border-top:0}
.wl .t{flex:1;min-width:0}.wl .s{font-size:12px;color:var(--mute)}
.sim .a{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}.sim .actor{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:12px 0 2px}
.sim select,.sim input{width:auto;padding:5px 8px;font-size:12px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:30px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.q{position:static;max-height:none}.rvg{grid-template-columns:1fr}.kv2{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><a class="logo" href="/" title="Accueil" style="color:#fff;text-decoration:none"><i></i>Nova Pro <small>· Console formaliste · dépôt de capital</small></a>
 <div class="tools"><button class="btn sm" id="al-badge" style="display:none;background:var(--ko)"></button><span class="clock" id="clock"></span><button class="btn ghost sm" data-clock="1">+1 jour</button><button class="btn ghost sm" data-clock="0">Aujourd’hui</button>
  <button class="btn ghost sm" id="demo">+ Démo statuts générés</button><button class="btn ghost sm" id="demo-cl">+ Démo statuts client</button><a href="/">Accueil</a><a href="/dashboard">Refus</a><a href="/#mailing">Mailing</a><a id="client-link" href="/client" target="_blank">Vue client ↗</a></div></div>
<div class="layout"><div class="card q" id="queue"></div><div id="detail"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>fetch('/api/'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>r.json());
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
const capE=x=>(x/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
let Q=[],V=null,sel=Number(new URLSearchParams(location.search).get('id'))||null,tab='todo',NOW=new Date();
const day=d=>d?new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'—';
const bd=(a,b)=>{let n=0;const x=new Date(a);x.setHours(0,0,0,0);const y=new Date(b);y.setHours(0,0,0,0);while(x<y){x.setDate(x.getDate()+1);if(x.getDay()%6)n++}return n};
const age=d=>{if(!d)return '';const n=bd(new Date(String(d).includes('T')?d:d.replace(' ','T')+'Z'),NOW);return n?`${n} j ouvré${n>1?'s':''}`:'aujourd’hui'};
const OWNER={agent:['À vous','me'],client:['Attente client','cl'],partner:['Partenaire','pt'],notary:['Notaire','nt'],none:['Terminé','ok']};
const WHO={team:'Partenaire (Swan)',notary:'Notaire'};

async function loadQueue(){Q=await api('capital/queue');drawQueue()}
function drawQueue(){
 const open=Q.filter(x=>!['Completed','Canceled'].includes(x.status));
 const F={todo:x=>x.owner=='agent',alerts:x=>x.alerts,late:x=>x.late.length,client:x=>x.owner=='client',open:x=>!['Completed','Canceled'].includes(x.status),all:()=>true};
 const L={todo:'À traiter',alerts:'Alertes partenaire',late:'En retard',client:'Attente client',open:'En cours',all:'Tous'};
 const nA=Q.reduce((a,x)=>a+x.alerts,0),bdg=$('#al-badge');bdg.style.display=nA?'':'none';bdg.textContent=`⚠ ${nA} alerte${nA>1?'s':''} partenaire`;
 const list=Q.filter(F[tab]).sort((a,b)=>(b.owner=='agent')-(a.owner=='agent')||b.late.length-a.late.length||String(a.toReviewSince||a.status_since).localeCompare(String(b.toReviewSince||b.status_since)));
 $('#queue').innerHTML=`<div class="hd" style="margin-bottom:10px"><h3 style="margin:0">Dossiers</h3><span class="sub">${open.length} en cours</span></div>
  <div class="qtabs">${Object.keys(L).map(k=>`<button data-tab="${k}" class="${tab==k?'on':''}">${L[k]} (${Q.filter(F[k]).length})</button>`).join('')}</div>
  ${list.map(x=>`<button class="qi ${x.id==sel?'on':''}" data-case="${x.id}"><div class="r1"><b>${esc(x.company_name)}</b><span class="sub mono">${esc(x.ref)}</span></div>
   <div class="sub">${esc(x.label)} · ${age(x.status_since)}</div>
   <div class="chips"><span class="chip ${OWNER[x.owner][1]}">${OWNER[x.owner][0]}</span>${x.toFix?`<span class="chip me">${x.toFix} doc généré à corriger</span>`:''}${x.toReview?`<span class="chip pt">${x.toReview} doc${x.toReview>1?'s':''} chez Swan · ${age(x.toReviewSince)}</span>`:''}${x.partnerEmails?`<span class="chip me">${x.partnerEmails} email partenaire</span>`:''}${x.alerts?`<span class="chip late">${x.escalated?'Escalade':'Relance'} partenaire</span>`:x.late.length?`<span class="chip late">Retard</span>`:''}${x.status=='Completed'?`<span class="chip ok">Capital viré le ${day(x.release?.date)}</span>`:x.release?.date&&x.status!='Canceled'?`<span class="chip">Capital ≈ ${day(x.release.date)}</span>`:''}</div></button>`).join('')||'<div class="sub empty">Aucun dossier ici.</div>'}`}
async function loadCase(id){sel=id;const u=new URL(location);u.searchParams.set('id',id);history.replaceState(null,'',u);const [v,th]=await Promise.all([api('capital?id='+id),api('threads?caseId='+id)]);V=v;V.threads=th.items;NOW=new Date(V.plan.now);drawQueue();drawCase()}
function setV(r){const th=V?.threads;V=r;V.threads=th;NOW=new Date(r.plan.now);drawCase();api('threads?caseId='+r.case.id).then(t=>{V.threads=t.items;drawCase()});api('capital/queue').then(q=>{Q=q;drawQueue()})}

function drawCase(){
 if(!V?.case){$('#detail').innerHTML='<div class="card empty sub">Sélectionnez un dossier.</div>';return}
 const c=V.case,S=V.shareholders,D=V.documents,p=V.plan,adm=S.find(s=>s.is_admin)||S[0];
 $('#client-link').href='/client?id='+c.id;
 const collecting=['WaitingForInitialRequirements','WaitingForAdditionalInformation'].includes(c.status);
 const toReview=D.filter(d=>d.status=='Uploaded'&&!d.kyc&&!d.notary&&d.type!='RegisterExtract'&&(collecting||c.status=='PendingInternalReview'));
 const firstTodo=p.todos[adm.id]?.[0];
 const allTodos=S.flatMap(s=>(p.todos[s.id]||[]).map(t=>({...t,who:s.name,sh:s})));
 const late=p.waiting.filter(w=>w.late);
 $('#detail').innerHTML=`
 <div class="card"><div class="hd"><div><div class="sub mono">${esc(c.ref)} · ID Swan ${esc(c.swan_id.slice(0,8))}… <button class="lnk" data-copy="${esc(c.swan_id)}">copier</button></div><h2>${esc(c.company_name)} <span class="sub" style="font-size:13px">${esc(c.legal_form||'')}</span></h2><div class="sub">${esc(c.address||'')}</div></div>
  <div style="text-align:right"><span class="pill ${c.status=='Completed'?'t-ok':c.status=='Canceled'?'t-ko':'t-info'}">${esc(c.label)}</span><div class="sub mono" style="margin-top:4px">${esc(c.status)} · ${age(c.status_since||c.created_at)}</div></div></div>
  <div class="kv2"><div><div class="lbl">Capital</div><div class="v">${capE(c.total_cents)}</div><div class="sub">${capE(V.funded)} reçus</div></div>
   <div><div class="lbl">Prêt pour vérification</div><div class="v">${collecting?day(p.collectingReady):'fait'}</div></div>
   <div><div class="lbl">Attestation</div><div class="v">${day(p.estimates.certificate?.date)}</div><div class="sub">${p.estimates.certificate?.done?'délivrée':'estimée'}</div></div>
   <div><div class="lbl">Capital libéré</div><div class="v">${day(p.estimates.release?.date)}</div><div class="sub">${p.estimates.release?.done?'viré':'estimé'}</div></div></div>
  ${late.length?`<div class="warn bad" style="margin-top:12px"><b>Délais dépassés</b><br>${late.map(w=>`${esc(WHO[w.who]||w.who)} · ${esc(w.title)} : prévu le ${day(w.due)} (SLA ${w.sla} j ouvré${w.sla>1?'s':''})`).join('<br>')}</div>`:''}
  ${V.partnerEmails?`<div class="warn" style="margin-top:12px"><b>${V.partnerEmails} email du partenaire à valider</b> avant que le client ne voie la demande. <a href="/#mailing">Ouvrir Mailing</a></div>`:''}
  ${!['Completed','Canceled'].includes(c.status)?`<div class="sees"><b>Ce que voit le fondateur :</b> ${firstTodo?`« ${esc(firstTodo.title)} »`:(()=>{const o=allTodos.filter(t=>t.sh.id!=adm.id).sort((a,b)=>!!b.urgent-!!a.urgent)[0];return o?`« ${esc(o.who)} doit ${esc(o.title.replace(/votre/g,'son').replace(/^(Remplacer|Déposer) : (.)/,(m,v,c)=>v.toLowerCase()+' son '+c.toLowerCase()).replace(/^./,x=>x.toLowerCase()))} » · bouton Relancer`:'« Rien à faire de votre côté »'+(p.waiting[0]?` · attend : ${esc(p.waiting[0].title)}`:'')})()}</div>`:''}</div>

 ${alertsCard()}
 ${threadsCard()}
 ${toReview.length?`<div class="card"><h3>Documents en analyse chez Swan (${toReview.length})</h3><div class="sub" style="margin-bottom:8px">Déjà contrôlés par nos soins avant envoi : Swan les valide ou les refuse (voir « Simuler les autres acteurs »).</div><ul class="wl">${toReview.map(d=>`<li><span class="chip pt">Chez Swan</span><div class="t"><b>${esc(d.label)}</b> · ${esc(d.owner)}<div class="s">transmis ${age(d.status_since)} · réponse attendue sous ${V.plan.sla.docCheck} j ouvré${d.refusals?` · ${d.refusals} refus précédent${d.refusals>1?'s':''}`:''}</div></div>${d.type=='ArticlesOfIncorporation'&&!d.generated?`<a class="btn ghost sm" href="/agent/statuts?id=${V.case.id}">Récapitulatif des statuts</a>`:''}</li>`).join('')}</ul></div>`:''}

 <div class="card"><h3>Qui doit agir</h3><ul class="wl">
  ${V.actions.filter(a=>a.id.startsWith('regenerate:')).map(a=>`<li><span class="chip me">À vous</span><div class="t"><b>${esc(a.label)}</b><div class="s">Refusé par le partenaire : corrigez le modèle ou la saisie. ${V.documents.find(d=>'regenerate:'+d.id==a.id)?.sign?'Les associés devront re-signer.':''}</div></div><button class="btn sm" data-act="${esc(a.id)}">Régénérer</button></li>`).join('')}
  ${allTodos.map(t=>`<li><span class="chip cl">Client</span><div class="t"><b>${esc(t.who)}</b> · ${esc(t.title.replace(/votre/g,'son'))}<div class="s">${age(t.since)}</div></div>${V.actions.some(a=>a.id=='remind:'+t.sh.id)?`<button class="btn ghost sm" data-act="remind:${t.sh.id}">Relancer</button>`:''}</li>`).join('')}
  ${p.waiting.map(w=>`<li><span class="chip ${w.who=='notary'?'nt':'pt'}">${w.who=='notary'?'Notaire':'Partenaire'}</span><div class="t">${esc(w.title)}${w.internal?` <span class="chip me">${esc(w.internal)}</span>`:''}<div class="s">${age(w.since)} · ${w.late?`<b style="color:var(--ko)">prévu le ${day(w.due)}</b>`:'prévu le '+day(w.due)}</div></div></li>`).join('')}
  ${!allTodos.length&&!p.waiting.length?'<li class="sub">Personne : dossier terminé.</li>':''}</ul></div>

 <div class="card"><h3>Pièces du dossier</h3><div style="overflow:auto"><table><thead><tr><th>Document</th><th>Titulaire</th><th>Statut</th><th>Depuis</th><th class="r">Refus</th></tr></thead><tbody>
  ${D.map(d=>`<tr><td><b>${esc(d.label)}</b>${d.kyc?'<div class="sub">KYC partenaire</div>':''}${d.type=='ArticlesOfIncorporation'&&!d.generated?`<div class="sub">Fournis par le client · <a href="/agent/statuts?id=${c.id}">récapitulatif</a></div>`:''}${d.generated?`<div class="sub">Généré · cohérent avec le dossier · <a target="_blank" href="${esc(d.preview)}">aperçu</a></div>`:''}</td><td>${esc(d.owner)}</td><td><span class="pill ${({Validated:'t-ok',Uploaded:'t-info',Pending:'t-mute',Refused:'t-ko'})[d.status]}">${esc(d.status_label)}</span>${d.explanation?`<div class="sub">${esc(d.explanation.title)}</div>`:''}</td><td class="sub">${age(d.status_since||c.created_at)}</td><td class="r">${d.refusals||''}</td></tr>`).join('')}</tbody></table></div></div>

 <div class="card"><h3>Associés</h3><table><tbody>${S.map(s=>`<tr><td><b>${esc(s.name)}</b>${s.is_admin?' <span class="chip">Fondateur</span>':''}<div class="sub">${esc(s.email)} · ${esc(s.address||'')}</div></td><td>${capE(s.amount_cents)}</td><td><span class="pill t-info">${esc(s.label)}</span><div class="sub">${s.signed_at?'✓ statuts et mandat signés':'<span style="color:var(--warn)">signature en attente</span>'} · ${age(s.status_since||c.created_at)}${s.attempts?` · ${s.attempts}/2 virement(s)`:''}</div></td><td class="r mono">${esc(s.iban||'')}</td></tr>`).join('')}</tbody></table></div>

 ${simCard()}
 <div class="card"><details><summary class="lnk">Historique et messages envoyés (${V.messages.length})</summary><ul class="wl" style="margin-top:10px">${V.timeline.map(e=>`<li><div class="t">${esc(e.text)}<div class="s">${new Date(e.created_at+'Z').toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</div></div></li>`).join('')}</ul></details></div>`;
 }

// Alertes de délai dépassé côté partenaire : relance (support) puis escalade (responsable de compte)
// Conversations Swan / nous / client de ce dossier (une par demande du partenaire)
function threadsCard(){const T=V.threads||[];if(!T.length)return '';const W={nous:'me',client:'cl',swan:'pt'};
 return `<div class="card"><h3>Échanges partenaire et client (${T.length})</h3><ul class="wl">${T.map(t=>`<li><span class="chip ${t.status=='closed'?'ok':W[t.waiting_on]||''}">${esc(t.waiting_label)}</span>
  <div class="t"><b>${esc(t.subject||'Demande du partenaire')}</b>${t.ticket?` <span class="sub mono">#${esc(t.ticket)}</span>`:''}<div class="s">${t.n} message${t.n>1?'s':''} · dernier ${age(t.last_at)} · « ${esc((t.last_body||'').replace(/\s+/g,' ').slice(0,90))}… »</div></div>
  <a class="btn ${t.waiting_on=='nous'&&t.status!='closed'?'':'ghost'} sm" href="/agent/conversation?id=${t.id}">Ouvrir</a></li>`).join('')}</ul></div>`}
function alertsCard(){const A=V.alerts||[];if(!A.length)return '';const open=A.filter(a=>!a.resolved_at),done=A.filter(a=>a.resolved_at);
 const row=a=>{const to=a.level=='escalade'?V.partnerContacts.manager:V.partnerContacts.support;
  return `<li><span class="chip ${a.resolved_at?'ok':'late'}">${a.level=='escalade'?'Escalade':'Relance'}</span><div class="t"><b>${esc(a.title)}</b><div class="s">échéance ${day(a.due)} · ${a.late_days} j ouvré${a.late_days>1?'s':''} de retard · ouverte ${age(a.opened_at)}${a.relaunched_at?` · <b>${a.level=='escalade'?'escaladée':'relancée'} ${age(a.relaunched_at)}</b>`:''}${a.acked_at?' · acquittée':''}${a.resolved_at?' · résolue':''}</div>${!a.resolved_at?`<div class="s">→ ${esc(to.name)} &lt;${esc(to.email)}&gt;</div>`:''}</div>
  ${a.resolved_at?'':`${a.relaunched_at?'':`<button class="btn sm" data-alert="${a.id}" data-aa="relaunch">${a.level=='escalade'?'Escalader':'Relancer le partenaire'}</button>`}${a.acked_at?'':` <button class="btn ghost sm" data-alert="${a.id}" data-aa="ack">Acquitter</button>`}`}</li>`};
 return `<div class="card" style="${open.length?'border-color:var(--ko)':''}"><h3>Délais partenaire ${open.length?`<span class="chip late">${open.length} ouverte${open.length>1?'s':''}</span>`:''}</h3>
  <div class="sub" style="margin-bottom:8px">Relance dès que le délai convenu est dépassé, escalade au responsable de compte après ${V.escalateAfter} jours ouvrés de retard. Le client voit seulement « nous relançons ».</div>
  <ul class="wl">${open.map(row).join('')}</ul>${done.length?`<details style="margin-top:8px"><summary class="lnk">Alertes résolues (${done.length})</summary><ul class="wl">${done.map(row).join('')}</ul></details>`:''}</div>`}
// Actions des tiers (partenaire, notaire, client) : simulation pour faire avancer le dossier
function simCard(){const A=V.actions.filter(a=>!/^(remind|regenerate):/.test(a.id));if(!A.length)return '';const by={};A.forEach(a=>(by[a.actorLabel]=by[a.actorLabel]||[]).push(a));
 return `<div class="card sim"><details><summary class="lnk">Simuler les autres acteurs (${A.length} actions)</summary>${Object.entries(by).map(([k,l])=>`<div class="actor">${esc(k)}</div>`+l.map(a=>`<div class="a"><span>${esc(a.label)}</span><span>${a.needsReason?`<select data-r-for="${esc(a.id)}">${Object.entries(a.needsReason=='cancel'?V.cancelReasons:V.reasons).map(([k,t])=>`<option value="${k}">${esc(t)}</option>`).join('')}</select> `:''}${a.needsReason=='doc'?`<input data-c-for="${esc(a.id)}" placeholder="Commentaire de l’analyste Swan (facultatif)" aria-label="Commentaire de l’analyste">`:''} <button class="btn ghost sm" data-act="${esc(a.id)}">Passer</button></span></div>`).join('')).join('')}</details></div>`}

document.addEventListener('change',e=>{
});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;drawQueue();return}
 if(b.id=='al-badge'){tab='alerts';drawQueue();const f=Q.find(x=>x.alerts);if(f)loadCase(f.id);return}
 if(b.dataset.alert){b.disabled=true;const r=await api(`capital/alerts/${b.dataset.alert}/${b.dataset.aa}`,{});if(r.error){toast(r.error);b.disabled=false;return}setV(r);toast(b.dataset.aa=='ack'?'Alerte acquittée':'Message envoyé au partenaire');return}
 if(b.dataset.case){loadCase(+b.dataset.case);return}
 if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('Copié')}catch{toast(b.dataset.copy)}return}
 if(b.dataset.clock!==undefined){const r=await api('test/clock',{days:+b.dataset.clock});if(r.error)return toast(r.error);drawClock(r);await loadQueue();if(sel)loadCase(sel);if(r.alertsOpened)toast(`${r.alertsOpened} alerte(s) délai partenaire ouverte(s)`);return}
 if(b.id=='demo'||b.id=='demo-cl'){const n=['Atelier Lumen','Brasserie Okto','Kalo Studio','Verde Mobilité','Pixel & Co'][Math.floor(Math.random()*5)]+' SAS';
  const r=await api('capital',{companyName:n,legalForm:'SAS',address:'12 rue de la Paix, 75002 Paris',shareholders:[{name:'Inès Moreau',email:'ines@example.fr',amount:4000,address:'3 rue Oberkampf, 75011 Paris'},{name:'Hugo Petit',email:'hugo@example.fr',amount:1000,address:'9 quai Perrache, 69002 Lyon'}],articlesSource:b.id=='demo-cl'?'client':'generated'});
  if(r.error)return toast(r.error);toast('Dossier créé');await loadQueue();loadCase(r.case.id);return}
 let body=null;
 if(b.dataset.act){const rs=document.querySelector(`[data-r-for="${CSS.escape(b.dataset.act)}"]`),cm=document.querySelector(`[data-c-for="${CSS.escape(b.dataset.act)}"]`);body={action:b.dataset.act,reasonCode:rs?.value,message:cm?.value||undefined}}
 if(!body)return;b.disabled=true;const r=await api(`capital/${V.case.id}/act`,body);if(r.error){toast(r.error);b.disabled=false;return}
 setV(r);toast(b.dataset.act?.startsWith('remind')?'Relance envoyée':'Action passée')});
function drawClock(c){const el=$('#clock');el.textContent=(c.offsetDays?`Horloge +${c.offsetDays} j · `:'')+new Date(c.now).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});el.classList.toggle('shifted',!!c.offsetDays)}
(async()=>{Q=await api('capital/queue');const first=sel||Q.find(x=>x.owner=='agent')?.id||Q[0]?.id;if(!Q.some(x=>x.owner=='agent'))tab='open';drawQueue();
 if(first)await loadCase(first);else drawCase();if(V?.clock)drawClock(V.clock);else drawClock({offsetDays:0,now:new Date().toISOString()})})();
</script></body></html>
